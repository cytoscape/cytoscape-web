name: Release

on:
  release:
    types: [published]

jobs:
  build-and-release:
    name: Build, Package & Publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build

      - name: Create release zip
        run: |
          cd dist
          zip -r "../cytoscape-web-${{ github.ref_name }}.zip" .

      - name: Upload zip to release
        run: |
          gh release upload "${{ github.ref_name }}" \
            "cytoscape-web-${{ github.ref_name }}.zip" \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set api-types version from release tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          npm version "$VERSION" --workspace=packages/api-types --no-git-tag-version

      - name: Build api-types package
        run: npm run build:api-types

      - name: Publish @cytoscape-web/api-types to npm
        run: npm publish --workspace=packages/api-types --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
