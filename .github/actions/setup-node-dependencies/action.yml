name: Setup Node dependencies
description: Restore the installed dependency tree or run npm ci on a cache miss

inputs:
  cache-suffix:
    description: Separates caches for different runner environments
    required: false
    default: standard

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm

    - name: Restore installed dependencies
      id: dependencies
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          packages/*/node_modules
        key: ${{ runner.os }}-node-modules-${{ inputs.cache-suffix }}-${{ hashFiles('package-lock.json') }}

    - name: Install dependencies
      if: steps.dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
