# Netlify config for the CyWeb App API docs site.
#
# This is a SEPARATE Netlify project from the main Cytoscape Web app. The site
# is a single committed, self-contained static file — no build step. Regenerate
# it in-repo with `npm run generate:api-docs`, commit, and Netlify redeploys.
#
# One-time setup (dashboard): Add new site → Import from Git → set the site's
# Base directory to `docs-site`. Netlify then reads this file and, because the
# base is scoped here, skips deploys for commits that don't touch docs-site/.

[build]
  publish = "."
  command = "echo 'Static site — index.html is committed; no build needed.'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
