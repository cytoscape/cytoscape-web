":"getCurrentNetworkId","params":[],"returnType":"ApiResult\u003c{ networkId: IdType }>","signature":"getCurrentNetworkId(): ApiResult\u003c{ networkId: IdType }>","jsdoc":"Returns the currently active network ID.\nfail(NoCurrentNetwork) when no networks are open or no network is selected."},"switchCurrentNetwork":{"name":"switchCurrentNetwork","params":[{"name":"networkId","type":"IdType","optional":false}],"returnType":"ApiResult","signature":"switchCurrentNetwork(networkId: IdType): ApiResult","jsdoc":"Switches the active network in the workspace.\n`network:switched` fires automatically via initEventBus.\nfail(InvalidInput) for empty string. fail(NetworkNotFound) if not in workspace."},"setWorkspaceName":{"name":"setWorkspaceName","params":[{"name":"name","type":"string","optional":false}],"returnType":"ApiResult","signature":"setWorkspaceName(name: string): ApiResult","jsdoc":"Renames the workspace.\nfail(InvalidInput) for empty/whitespace-only names."}}}}}},"errorCodes":[{"code":"N3","name":null,"catalog":"ElementCodes","catalogSubtitle":"node/edge existence and structural rules","severity":"error","returnedBy":["createNode","createNodes"],"cx2Spec":"`cx2-node-requirements#N3` — \"Node id MUST NOT appear as a key in v\".","descriptionHtml":"\u003cp>The \u003ccode>attributes\u003c/code> payload passed to \u003ccode>createNode\u003c/code> (or a \u003ccode>NodeSpec\u003c/code> in\n\u003ccode>createNodes\u003c/code>) contained an \u003ccode>&quot;id&quot;\u003c/code> key. The element ID lives outside the\nattributes object; shadowing it is forbidden.\u003c/p>\n","text":"N3 cx2-node-requirements#N3 — \"Node id MUST NOT appear as a key in v\". The attributes payload passed to createNode (or a NodeSpec in createNodes ) contained an \"id\" key. The element ID lives outside the attributes object; shadowing it is forbidden."},{"code":"E6","name":null,"catalog":"ElementCodes","catalogSubtitle":"node/edge existence and structural rules","severity":"error","returnedBy":["createEdge","createEdges"],"cx2Spec":"`cx2-edge-requirements#E6`.","descriptionHtml":"\u003cp>Same rule as N3, for edges.\u003c/p>\n","text":"E6 cx2-edge-requirements#E6 . Same rule as N3, for edges."},{"code":"GL1","name":null,"catalog":"ElementCodes","catalogSubtitle":"node/edge existence and structural rules","severity":"error","returnedBy":["getNode","createEdge","createEdges","moveEdge","deleteNodes","getConnectedEdges","getConnectedNodes","getOutgoers","getIncomers","getSuccessors","getPredecessors","getValue","getRow","setValue","setValues","editRows","applyValueToElements","updateNodePositions","createNetworkFromNodeList"],"cx2Spec":"`cx2-library-design-requirements#GL1` — a CX2-library-defined \"runtime and lifecycle\" code (distinct from the document-validation codes), which app-api reuses directly since it describes the identical concept.","descriptionHtml":"\u003cp>A referenced node ID does not exist in the network. This is app-api&#39;s most\ncommon failure — every method that takes a node ID (or a list of node IDs)\nreturns this when a lookup misses.\u003c/p>\n","text":"GL1 cx2-library-design-requirements#GL1 — a CX2-library-defined \"runtime and lifecycle\" code (distinct from the document-validation codes), which app-api reuses directly since it describes the identical concept. A referenced node ID does not exist in the network. This is app-api's most common failure — every method that takes a node ID (or a list of node IDs) returns this when a lookup misses."},{"code":"GL2","name":null,"catalog":"ElementCodes","catalogSubtitle":"node/edge existence and structural rules","severity":"error","returnedBy":["getEdge","moveEdge","deleteEdges","getValue","getRow","setValue","setValues","editRows","applyValueToElements","createNetworkFromNodeList"],"cx2Spec":"`cx2-library-design-requirements#GL2`.","descriptionHtml":"\u003cp>Same as GL1, for edges.\u003c/p>\n\u003chr>\n","text":"GL2 cx2-library-design-requirements#GL2 . Same as GL1, for edges."},{"code":"FK1","name":null,"catalog":"TableCodes","catalogSubtitle":"column/attribute rules","severity":"error","returnedBy":["createColumn","renameColumn","importTableFromTsv"],"cx2Spec":"`cx2-library-design-requirements#FK1`.","descriptionHtml":"\u003cp>A column named \u003ccode>&quot;id&quot;\u003c/code> was requested for a node table. \u003ccode>id\u003c/code> is reserved for the\nelement identity and forbidden as a column name. \u003ccode>importTableFromTsv\u003c/code> validates\nall new column names up front, so a TSV that would create an \u003ccode>&quot;id&quot;\u003c/code> column fails\nhere before any column is created.\u003c/p>\n","text":"FK1 cx2-library-design-requirements#FK1 . A column named \"id\" was requested for a node table. id is reserved for the element identity and forbidden as a column name. importTableFromTsv validates all new column names up front, so a TSV that would create an \"id\" column fails here before any column is created."},{"code":"FK2","name":null,"catalog":"TableCodes","catalogSubtitle":"column/attribute rules","severity":"error","returnedBy":["createColumn","renameColumn","importTableFromTsv"],"cx2Spec":"`cx2-library-design-requirements#FK2`.","descriptionHtml":"\u003cp>Same as FK1, for edge tables.\u003c/p>\n","text":"FK2 cx2-library-design-requirements#FK2 . Same as FK1, for edge tables."},{"code":"A8","name":null,"catalog":"TableCodes","catalogSubtitle":"column/attribute rules","severity":"error","returnedBy":["createColumn","renameColumn","importTableFromTsv"],"cx2Spec":"`cx2-validation-requirements#A8`.","descriptionHtml":"\u003cp>A column named \u003ccode>&quot;s&quot;\u003c/code> or \u003ccode>&quot;t&quot;\u003c/code> was requested for an edge table — these keys are\nreserved for the edge&#39;s structural source/target reference and cannot be\nreused as an attribute column.\u003c/p>\n","text":"A8 cx2-validation-requirements#A8 . A column named \"s\" or \"t\" was requested for an edge table — these keys are reserved for the edge's structural source/target reference and cannot be reused as an attribute column."},{"code":"A6","name":null,"catalog":"TableCodes","catalogSubtitle":"column/attribute rules","severity":"error","returnedBy":["createColumn"],"cx2Spec":"`cx2-validation-requirements#A6`.","descriptionHtml":"\u003cp>\u003ccode>defaultValue\u003c/code> was \u003ccode>null\u003c/code> or \u003ccode>undefined\u003c/code>. Falsy-but-valid defaults (\u003ccode>0\u003c/code>,\n\u003ccode>false\u003c/code>, \u003ccode>&#39;&#39;\u003c/code>) are accepted.\u003c/p>\n","text":"A6 cx2-validation-requirements#A6 . defaultValue was null or undefined . Falsy-but-valid defaults ( 0 , false , '' ) are accepted."},{"code":"A1","name":null,"catalog":"TableCodes","catalogSubtitle":"column/attribute rules","severity":"error","returnedBy":["setValue","setValues","editRows","applyValueToElements","createColumn"],"cx2Spec":"`cx2-validation-requirements#A1`.","descriptionHtml":"\u003cp>A cell value did not match its column&#39;s declared type. Checked strictly — no\ncoercion (e.g. \u003ccode>1.5\u003c/code> is rejected for an \u003ccode>integer\u003c/code> column). For \u003ccode>createColumn\u003c/code>,\nthe \u003ccode>defaultValue\u003c/code> is validated against the column&#39;s declared \u003ccode>dataType\u003c/code> under\nthe same rule. Writes to \u003cem>undeclared\u003c/em> columns pass through unchecked\n(declaration policy is a separate, not-yet-implemented concern).\u003c/p>\n\u003cp>Note \u003ccode>importTableFromTsv\u003c/code> does \u003cstrong>not\u003c/strong> raise A1: unparseable cells are skipped\nand reported in its \u003ccode>skippedCells\u003c/code> result instead of failing the import.\u003c/p>\n","text":"A1 cx2-validation-requirements#A1 . A cell value did not match its column's declared type. Checked strictly — no coercion (e.g. 1.5 is rejected for an integer column). For createColumn , the defaultValue is validated against the column's declared dataType under the same rule. Writes to undeclared columns pass through unchecked (declaration policy is a separate, not-yet-implemented concern). Note importTableFromTsv does not raise A1: unparseable cells are skipped and reported in its skippedCells result instead of failing the import."},{"code":"AC6","name":null,"catalog":"TableCodes","catalogSubtitle":"column/attribute rules","severity":"error","returnedBy":["createColumn","renameColumn"],"cx2Spec":"`cx2-library-design-requirements#AC6`.","descriptionHtml":"\u003cp>The requested column name is already declared on the table. Renaming a column\nto its own current name is treated as a no-op, not a collision.\u003c/p>\n\u003chr>\n","text":"AC6 cx2-library-design-requirements#AC6 . The requested column name is already declared on the table. Renaming a column to its own current name is treated as a no-op, not a collision."},{"code":"BV1","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setBypass"],"cx2Spec":"`cx2-library-design-requirements#BV1` — \"Element does not exist for bypass,\" a context-specific existence check distinct from the generic GL1/GL2 lookups.","descriptionHtml":"\u003cp>One or more \u003ccode>elementIds\u003c/code> passed to \u003ccode>setBypass\u003c/code> do not exist in the network.\nThe message names the missing IDs.\u003c/p>\n","text":"BV1 cx2-library-design-requirements#BV1 — \"Element does not exist for bypass,\" a context-specific existence check distinct from the generic GL1/GL2 lookups. One or more elementIds passed to setBypass do not exist in the network. The message names the missing IDs."},{"code":"BV2","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setBypass"],"cx2Spec":"`cx2-library-design-requirements#BV2`.","descriptionHtml":"\u003cp>An element ID in \u003ccode>setBypass\u003c/code> exists but doesn&#39;t match the visual property&#39;s\nscope — a node-scoped property was bypassed with an edge ID, or vice versa.\u003c/p>\n","text":"BV2 cx2-library-design-requirements#BV2 . An element ID in setBypass exists but doesn't match the visual property's scope — a node-scoped property was bypassed with an edge ID, or vice versa."},{"code":"BV5","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setBypass"],"cx2Spec":"`cx2-library-design-requirements#BV5`.","descriptionHtml":"\u003cp>\u003ccode>setBypass\u003c/code> was called for a network-scoped visual property. Network-scoped\nproperties apply globally and cannot be bypassed per-element.\u003c/p>\n","text":"BV5 cx2-library-design-requirements#BV5 . setBypass was called for a network-scoped visual property. Network-scoped properties apply globally and cannot be bypassed per-element."},{"code":"MC1","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["createDiscreteMapping","createContinuousMapping","createPassthroughMapping"],"cx2Spec":"`cx2-library-design-requirements#MC1`.","descriptionHtml":"\u003cp>A mapping was requested for a network-scoped visual property. Mappings only\napply to node- or edge-scoped properties.\u003c/p>\n","text":"MC1 cx2-library-design-requirements#MC1 . A mapping was requested for a network-scoped visual property. Mappings only apply to node- or edge-scoped properties."},{"code":"MI1","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"warning (see the note at the top of this document)","returnedBy":["createDiscreteMapping","createContinuousMapping","createPassthroughMapping"],"cx2Spec":"`cx2-library-design-requirements#MI1`.","descriptionHtml":"\u003cp>The mapping&#39;s source \u003ccode>attribute\u003c/code> is not declared as a column in the matching\nnode/edge table.\u003c/p>\n","text":"MI1 cx2-library-design-requirements#MI1 . The mapping's source attribute is not declared as a column in the matching node/edge table."},{"code":"MI2","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"warning (see the note at the top of this document)","returnedBy":["createDiscreteMapping","createContinuousMapping","createPassthroughMapping"],"cx2Spec":"`cx2-library-design-requirements#MI2`.","descriptionHtml":"\u003cp>The caller-supplied \u003ccode>attributeType\u003c/code> does not match the declared type of the\nmapping&#39;s source column.\u003c/p>\n","text":"MI2 cx2-library-design-requirements#MI2 . The caller-supplied attributeType does not match the declared type of the mapping's source column."},{"code":"MI3","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"warning (see the note at the top of this document)","returnedBy":["createContinuousMapping"],"cx2Spec":"`cx2-library-design-requirements#MI3`.","descriptionHtml":"\u003cp>A \u003ccode>CONTINUOUS\u003c/code> mapping was requested against a non-numeric source column.\u003c/p>\n","text":"MI3 cx2-library-design-requirements#MI3 . A CONTINUOUS mapping was requested against a non-numeric source column."},{"code":"V7","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["createContinuousMapping"],"cx2Spec":"`cx2-validation-requirements#V7`.","descriptionHtml":"\u003cp>\u003ccode>attributeValues\u003c/code> was empty, contained non-numeric/non-finite values, or a\nsupplied \u003ccode>controlPoints\u003c/code> entry had a non-numeric/non-finite \u003ccode>value\u003c/code>. \u003ccode>NaN\u003c/code> and\n\u003ccode>Infinity\u003c/code> are rejected outright, not coerced to \u003ccode>null\u003c/code>.\u003c/p>\n","text":"V7 cx2-validation-requirements#V7 . attributeValues was empty, contained non-numeric/non-finite values, or a supplied controlPoints entry had a non-numeric/non-finite value . NaN and Infinity are rejected outright, not coerced to null ."},{"code":"VP1","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP1`.","descriptionHtml":"\u003cp>The value for a \u003ccode>string\u003c/code>-typed visual property was not a string.\u003c/p>\n","text":"VP1 cx2-validation-requirements#VP1 . The value for a string -typed visual property was not a string."},{"code":"VP2","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP2`.","descriptionHtml":"\u003cp>The value for a \u003ccode>color\u003c/code>-typed visual property was not a hex color string\n(\u003ccode>#rgb\u003c/code>, \u003ccode>#rrggbb\u003c/code>, or \u003ccode>#rrggbbaa\u003c/code>).\u003c/p>\n","text":"VP2 cx2-validation-requirements#VP2 . The value for a color -typed visual property was not a hex color string ( #rgb , #rrggbb , or #rrggbbaa )."},{"code":"VP3","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP3`.","descriptionHtml":"\u003cp>The value for an opacity property was outside the \u003ccode>0\u003c/code>–\u003ccode>1\u003c/code> range.\u003c/p>\n","text":"VP3 cx2-validation-requirements#VP3 . The value for an opacity property was outside the 0 – 1 range."},{"code":"VP4","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP4`.","descriptionHtml":"\u003cp>The value for a \u003ccode>number\u003c/code>-typed visual property was not a finite number.\u003c/p>\n","text":"VP4 cx2-validation-requirements#VP4 . The value for a number -typed visual property was not a finite number."},{"code":"VP5","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP5`.","descriptionHtml":"\u003cp>The value did not match the property&#39;s enum (node shape, edge line style,\nedge arrow shape, border line style, visibility, horizontal/vertical align).\nAlso used for \u003ccode>boolean\u003c/code>-typed properties that received a non-boolean value —\nCX2 has no dedicated boolean code, and a boolean is effectively a two-value\nenum.\u003c/p>\n","text":"VP5 cx2-validation-requirements#VP5 . The value did not match the property's enum (node shape, edge line style, edge arrow shape, border line style, visibility, horizontal/vertical align). Also used for boolean -typed properties that received a non-boolean value — CX2 has no dedicated boolean code, and a boolean is effectively a two-value enum."},{"code":"VP6","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP6`.","descriptionHtml":"\u003cp>The value for a font-face property was not a recognized font.\u003c/p>\n","text":"VP6 cx2-validation-requirements#VP6 . The value for a font-face property was not a recognized font."},{"code":"VP7","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP7`.","descriptionHtml":"\u003cp>A \u003ccode>LabelPosition\u003c/code> object was missing a required align/anchor key, had an\ninvalid enum value for one, or had a non-finite \u003ccode>MARGIN_X\u003c/code>/\u003ccode>MARGIN_Y\u003c/code>.\u003c/p>\n","text":"VP7 cx2-validation-requirements#VP7 . A LabelPosition object was missing a required align/anchor key, had an invalid enum value for one, or had a non-finite MARGIN_X / MARGIN_Y ."},{"code":"VP9","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP9`.","descriptionHtml":"\u003cp>A \u003ccode>CustomGraphics\u003c/code> object had an unknown \u003ccode>type\u003c/code>/\u003ccode>name\u003c/code>, or a non-object\n\u003ccode>properties\u003c/code> field.\u003c/p>\n","text":"VP9 cx2-validation-requirements#VP9 . A CustomGraphics object had an unknown type / name , or a non-object properties field."},{"code":"VP10","name":null,"catalog":"StyleCodes","catalogSubtitle":"visual style, mapping, and bypass rules","severity":"error","returnedBy":["setDefault","setBypass"],"cx2Spec":"`cx2-validation-requirements#VP10`.","descriptionHtml":"\u003cp>A \u003ccode>CustomGraphicsPosition\u003c/code> object had an invalid \u003ccode>JUSTIFICATION\u003c/code>, a non-finite\nmargin, or an invalid anchor (must be one of \u003ccode>C\u003c/code>/\u003ccode>N\u003c/code>/\u003ccode>S\u003c/code>/\u003ccode>E\u003c/code>/\u003ccode>W\u003c/code>).\u003c/p>\n\u003chr>\n","text":"VP10 cx2-validation-requirements#VP10 . A CustomGraphicsPosition object had an invalid JUSTIFICATION , a non-finite margin, or an invalid anchor (must be one of C / N / S / E / W )."},{"code":"APP1","name":"NETWORK_NOT_FOUND","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":[],"cx2Spec":null,"descriptionHtml":"\u003cp>The specified \u003ccode>networkId\u003c/code> does not exist in the relevant store (network,\ntable, visual style, or view model — \u003ccode>exportToCx2\u003c/code> collapses all four checks\nto this one code, since externally there&#39;s nothing actionable in knowing\n\u003cem>which\u003c/em> store was missing versus that the network isn&#39;t fully available).\u003c/p>\n","text":"APP1 NETWORK_NOT_FOUND The specified networkId does not exist in the relevant store (network, table, visual style, or view model — exportToCx2 collapses all four checks to this one code, since externally there's nothing actionable in knowing which store was missing versus that the network isn't fully available)."},{"code":"APP2","name":"NO_CURRENT_NETWORK","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["deleteCurrentNetwork","getCurrentNetworkId"],"cx2Spec":null,"descriptionHtml":"\u003cp>No network is currently selected in the workspace (no networks are open, or\nnone is marked current).\u003c/p>\n","text":"APP2 NO_CURRENT_NETWORK No network is currently selected in the workspace (no networks are open, or none is marked current)."},{"code":"APP3","name":"OPERATION_FAILED","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["catch"],"cx2Spec":null,"descriptionHtml":"\u003cp>An internal store operation threw an unexpected error. This is the generic\n&quot;something went wrong that isn&#39;t one of the specific validation failures&quot;\nbucket — details are in the message, not a further-typed code.\u003c/p>\n","text":"APP3 OPERATION_FAILED An internal store operation threw an unexpected error. This is the generic \"something went wrong that isn't one of the specific validation failures\" bucket — details are in the message, not a further-typed code."},{"code":"APP4","name":"LAYOUT_ENGINE_NOT_FOUND","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["applyLayout"],"cx2Spec":null,"descriptionHtml":"\u003cp>No registered layout engine has an algorithm matching the requested (or\npreferred) name.\u003c/p>\n","text":"APP4 LAYOUT_ENGINE_NOT_FOUND No registered layout engine has an algorithm matching the requested (or preferred) name."},{"code":"APP5","name":"FUNCTION_NOT_AVAILABLE","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["fit"],"cx2Spec":null,"descriptionHtml":"\u003cp>The renderer&#39;s \u003ccode>fit\u003c/code> function is not yet registered for this network view\n(the renderer hasn&#39;t mounted, or hasn&#39;t registered its functions yet).\u003c/p>\n","text":"APP5 FUNCTION_NOT_AVAILABLE The renderer's fit function is not yet registered for this network view (the renderer hasn't mounted, or hasn't registered its functions yet)."},{"code":"APP6","name":"CONTEXT_MENU_ITEM_NOT_FOUND","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["removeContextMenuItem"],"cx2Spec":null,"descriptionHtml":"\u003cp>The specified \u003ccode>itemId\u003c/code> is not a currently-registered context menu item.\u003c/p>\n","text":"APP6 CONTEXT_MENU_ITEM_NOT_FOUND The specified itemId is not a currently-registered context menu item."},{"code":"APP7","name":"RESOURCE_NOT_FOUND","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["unregisterPanel","unregisterMenuItem"],"cx2Spec":null,"descriptionHtml":"\u003cp>The specified resource ID is not registered by this app in the given slot.\u003c/p>\n","text":"APP7 RESOURCE_NOT_FOUND The specified resource ID is not registered by this app in the given slot."},{"code":"APP8","name":"INVALID_CX2","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["createNetworkFromCx2"],"cx2Spec":null,"descriptionHtml":"\u003cp>The input document failed \u003ccode>validateCX2()\u003c/code>&#39;s structural validation. The message\nis the validator&#39;s own aggregated error text — \u003ccode>validateCX2()\u003c/code> currently\nreturns one combined message across all validation phases (structure,\nmetadata, referential integrity, attributes), not a per-rule diagnostic list,\nso this code cannot yet be decomposed into the specific CX2 rule that failed.\u003c/p>\n","text":"APP8 INVALID_CX2 The input document failed validateCX2() 's structural validation. The message is the validator's own aggregated error text — validateCX2() currently returns one combined message across all validation phases (structure, metadata, referential integrity, attributes), not a per-rule diagnostic list, so this code cannot yet be decomposed into the specific CX2 rule that failed."},{"code":"APP9","name":"INVALID_INPUT","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":[],"cx2Spec":null,"descriptionHtml":"\u003cp>A residual bucket for caller errors that don&#39;t correspond to a CX2 validation\nrequirement: empty required strings (\u003ccode>name\u003c/code>, \u003ccode>label\u003c/code>, column names before the\nFK1/A8 checks apply), empty required arrays (\u003ccode>edgeList\u003c/code>, \u003ccode>nodeIds\u003c/code>,\n\u003ccode>elementIds\u003c/code>), an unrecognized visual property or mapping type name, or a\nTSV import with too few lines or a missing key column. The message describes\nthe specific problem; the code itself is intentionally coarse — inventing a\nbespoke code for each one-off &quot;caller passed garbage&quot; case would add ceremony\nwithout adding information external callers can act on differently.\u003c/p>\n","text":"APP9 INVALID_INPUT A residual bucket for caller errors that don't correspond to a CX2 validation requirement: empty required strings ( name , label , column names before the FK1/A8 checks apply), empty required arrays ( edgeList , nodeIds , elementIds ), an unrecognized visual property or mapping type name, or a TSV import with too few lines or a missing key column. The message describes the specific problem; the code itself is intentionally coarse — inventing a bespoke code for each one-off \"caller passed garbage\" case would add ceremony without adding information external callers can act on differently."},{"code":"APP10","name":"COLUMN_NOT_FOUND","catalog":"AppCodes","catalogSubtitle":"runtime/registry concepts with no CX2 equivalent","severity":"error","returnedBy":["deleteColumn","renameColumn","getValue"],"cx2Spec":null,"descriptionHtml":"\u003cp>The named column does not exist in the target table. \u003ccode>deleteColumn\u003c/code> and\n\u003ccode>renameColumn\u003c/code> return this when the column to delete/rename is absent\n(previously these no-oped to \u003ccode>ok()\u003c/code>); \u003ccode>getValue\u003c/code> returns it when the requested\ncolumn is neither declared on the table nor present on the element&#39;s row. The\nmessage is \u003ccode>Column &quot;&lt;name&gt;&quot; does not exist in the &lt;tableType&gt; table\u003c/code>.\u003c/p>\n\u003cp>This is a runtime/registry concern with no CX2 equivalent — a static CX2\ndocument has no notion of a live &quot;does this column exist right now&quot; query — so\nit lives in the \u003ccode>APP*\u003c/code> namespace rather than reusing a CX2 column code.\u003c/p>\n","text":"APP10 COLUMN_NOT_FOUND The named column does not exist in the target table. deleteColumn and renameColumn return this when the column to delete/rename is absent (previously these no-oped to ok() ); getValue returns it when the requested column is neither declared on the table nor present on the element's row. The message is Column \" \" does not exist in the table . This is a runtime/registry concern with no CX2 equivalent — a static CX2 document has no notion of a live \"does this column exist right now\" query — so it lives in the APP* namespace rather than reusing a CX2 column code."}]}</script>
<script>
/* eslint-disable */
(function () {
  'use strict'
  var DATA = JSON.parse(document.getElementById('docs-data').textContent)
  var $ = function (s, r) { return (r || document).querySelector(s) }
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)) }
  var el = function (tag, cls, html) {
    var n = document.createElement(tag)
    if (cls) n.className = cls
    if (html != null) n.innerHTML = html
    return n
  }
  var esc = function (s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]
    })
  }

  /* ---------- signature syntax highlight ---------- */
  var KEYWORDS = /^(void|string|number|boolean|any|null|undefined|Promise|Array|Record|Partial|Readonly)$/
  function highlightSig(sig) {
    // Split into name( ... ) : return
    var m = sig.match(/^([A-Za-z_]\w*)\(([\s\S]*)\)\s*:\s*([\s\S]+)$/)
    if (!m) return esc(sig)
    var name = m[1], params = m[2], ret = m[3]
    var out = '<span class="tok-name">' + esc(name) + '</span><span class="tok-punct">(</span>'
    out += highlightParams(params)
    out += '<span class="tok-punct">): </span>' + highlightType(ret)
    return out
  }
  function splitTop(s, sep) {
    var parts = [], depth = 0, cur = ''
    for (var i = 0; i < s.length; i++) {
      var c = s[i]
      if (c === '<' || c === '(' || c === '{' || c === '[') depth++
      else if (c === '>' || c === ')' || c === '}' || c === ']') depth--
      if (c === sep && depth === 0) { parts.push(cur); cur = '' }
      else cur += c
    }
    if (cur.trim() !== '') parts.push(cur)
    return parts
  }
  function highlightParams(params) {
    if (!params.trim()) return ''
    return splitTop(params, ',').map(function (p) {
      var mm = p.match(/^\s*([A-Za-z_]\w*)(\??)\s*:\s*([\s\S]+?)\s*$/)
      if (!mm) return '<span class="tok-param">' + esc(p.trim()) + '</span>'
      var q = mm[2] ? '<span class="tok-opt">?</span>' : ''
      return '<span class="tok-param">' + esc(mm[1]) + '</span>' + q +
        '<span class="tok-punct">: </span>' + highlightType(mm[3])
    }).join('<span class="tok-punct">, </span>')
  }
  function highlightType(t) {
    // Tokenize into identifier / non-identifier runs and escape each fragment
    // separately, so inserted markup is never re-processed.
    var out = '', re = /([A-Za-z_]\w*)|([^A-Za-z_]+)/g, m
    while ((m = re.exec(t)) !== null) {
      if (m[1]) out += '<span class="tok-type">' + esc(m[1]) + '</span>'
      else out += '<span class="tok-punct">' + esc(m[2]) + '</span>'
    }
    return out
  }

  /* ---------- theme ---------- */
  var THEME_KEY = 'cyweb-docs-theme'
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t)
    $('#theme-btn').innerHTML = t === 'dark'
      ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M19 5l-1.5 1.5M6.5 17.5L5 19"/></svg>'
      : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>'
  }
  function initTheme() {
    var saved = null
    try { saved = localStorage.getItem(THEME_KEY) } catch (e) {}
    var t = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
    applyTheme(t)
    $('#theme-btn').addEventListener('click', function () {
      var next = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'
      applyTheme(next)
      try { localStorage.setItem(THEME_KEY, next) } catch (e) {}
    })
  }

  /* ---------- flatten helpers ---------- */
  function allMethods() {
    var out = []
    DATA.namespaces.forEach(function (ns) {
      ns.groups.forEach(function (g) {
        g.methods.forEach(function (mth) { out.push({ ns: ns, method: mth }) })
      })
    })
    return out
  }
  function findError(code) {
    for (var i = 0; i < DATA.errorCodes.length; i++) if (DATA.errorCodes[i].code === code) return DATA.errorCodes[i]
    return null
  }
  function methodAnchorExists(anchor) {
    return allMethods().some(function (x) { return x.method.anchor === anchor })
  }

  /* ============================================================
     CHANGELOG
     ============================================================ */
  var KIND_CLASS = { added: 'k-add', changed: 'k-change', fixed: 'k-fix', removed: 'k-removed' }
  var KIND_BADGE = { added: 'add', changed: 'change', fixed: 'fix', removed: 'removed' }
  function renderChangelog() {
    var v = $('#view-changelog')
    v.innerHTML = ''
    var head = el('div', 'page-head')
    head.innerHTML =
      '<div class="eyebrow">Release history</div>' +
      '<h1>Patch Notes</h1>' +
      '<p>Every documented change to <code>@cytoscape-web/api-types</code>, newest first. ' +
      'Breaking changes are flagged — this surface is experimental and evolving.</p>'
    v.appendChild(head)

    var tl = el('div', 'timeline')
    DATA.versions.forEach(function (ver, idx) {
      var rel = el('div', 'release' + (idx === 0 ? ' is-latest' : ''))
      rel.id = 'v-' + ver.version
      rel.innerHTML =
        '<div class="release-node"><div class="ring"><div class="core"></div></div></div>' +
        '<div class="release-head">' +
          '<span class="ver">' + esc(ver.version) + '</span>' +
          (idx === 0 ? '<span class="badge accent plain">latest</span>' : '') +
          (ver.sections.some(function (s) { return s.breaking }) ? '<span class="badge break">breaking</span>' : '') +
          (ver.date ? '<span class="date">' + esc(ver.date) + '</span>' : '') +
        '</div>'
      var body = el('div', 'release-body')
      ver.sections.forEach(function (sec) {
        var kc = KIND_CLASS[sec.kind] || 'k-change'
        if (sec.breaking) kc = 'k-break'
        var block = el('div', 'change-block ' + kc)
        block.innerHTML =
          '<div class="cb-head"><div class="cb-accent"></div>' + esc(sec.label) + '</div>' +
          '<div class="cb-body"><div class="prose">' + sec.html + '</div></div>'
        body.appendChild(block)
      })
      rel.appendChild(body)
      tl.appendChild(rel)
    })
    v.appendChild(tl)
    rewireInternalLinks(v)
  }

  /* ============================================================
     REFERENCE
     ============================================================ */
  function renderReference() {
    var v = $('#view-reference')
    v.innerHTML = ''
    var head = el('div', 'page-head')
    head.innerHTML =
      '<div class="eyebrow">API surface · ' + DATA.meta.methodCount + ' methods · ' + DATA.meta.namespaceCount + ' namespaces</div>' +
      '<h1>Reference</h1>' +
      '<p>Every public method on <code>window.CyWebApi</code> and the <code>cyweb/*</code> ' +
      'Module Federation hooks. Signatures are extracted from the TypeScript surface; ' +
      'behaviour and error codes from the spec.</p>'
    v.appendChild(head)

    var layout = el('div', 'ref-layout')
    var navEl = el('div', 'ref-nav')
    var mainEl = el('div', 'ref-main')

    DATA.namespaces.forEach(function (ns) {
      var count = ns.groups.reduce(function (n, g) { return n + g.methods.length }, 0)
      // nav group
      var ng = el('div', 'ns-group')
      ng.setAttribute('data-key', ns.key)
      var nh = el('button', 'ns-head')
      nh.innerHTML = '<span class="caret">▾</span>' + esc(ns.name) + '<span class="count">' + count + '</span>'
      nh.addEventListener('click', function () { ng.classList.toggle('collapsed') })
      var nm = el('div', 'ns-methods')
      ns.groups.forEach(function (g) {
        g.methods.forEach(function (mth) {
          var a = el('a')
          a.href = '#reference/' + mth.anchor
          a.textContent = mth.name
          a.setAttribute('data-anchor', mth.anchor)
          nm.appendChild(a)
        })
      })
      ng.appendChild(nh); ng.appendChild(nm); navEl.appendChild(ng)

      // main section
      var sec = el('section', 'ns-section')
      sec.id = 'ns-' + ns.key
      var title = '<div class="ns-title"><h2>' + esc(ns.name) + '</h2>' +
        (ns.moduleId ? '<span class="mod">' + esc(ns.moduleId) + '</span>' : '') +
        '<span class="badge neutral plain">' + count + ' methods</span></div>'
      sec.innerHTML = title + (ns.descriptionHtml ? '<div class="ns-desc prose">' + ns.descriptionHtml + '</div>' : '')

      ns.groups.forEach(function (g) {
        if (g.typesHtml) {
          var d = el('details', 'types')
          d.innerHTML = '<summary>Types</summary><div class="prose">' + g.typesHtml + '</div>'
          sec.appendChild(d)
          return
        }
        if (!g.methods.length) return
        if (g.title && g.title.toLowerCase() !== 'methods') {
          sec.appendChild(el('div', 'group-label', esc(g.title)))
        }
        if (g.intHtml) sec.appendChild(el('div', 'prose', g.intHtml))
        g.methods.forEach(function (mth) {
          sec.appendChild(renderMethod(mth))
        })
      })
      mainEl.appendChild(sec)
    })

    layout.appendChild(navEl); layout.appendChild(mainEl); v.appendChild(layout)
    rewireInternalLinks(v)
    setupRefScrollSpy()
  }

  function renderMethod(mth) {
    var m = el('div', 'method')
    m.id = 'm-' + mth.anchor
    var sig = mth.tsSignature || mth.docSignature
    var errbar = ''
    if (mth.errorRefs && mth.errorRefs.length) {
      errbar = '<div class="errbar"><span class="lbl">Errors</span>' +
        mth.errorRefs.map(function (er) {
          return '<a class="err-chip" href="#errors/' + esc(er.code) + '" title="' + esc(er.condition.replace(/<[^>]+>/g, '')) + '">' + esc(er.code) + '</a>'
        }).join('') + '</div>'
    }
    m.innerHTML =
      '<div class="method-sig"><a class="anchor" href="#reference/' + mth.anchor + '" title="Link to ' + esc(mth.name) + '">#</a>' +
        '<span class="sig-code">' + highlightSig(sig) + '</span></div>' +
      '<div class="method-body"><div class="prose">' + (mth.descriptionHtml || '') + '</div>' + errbar + '</div>'
    return m
  }

  function setupRefScrollSpy() {
    var links = $$('.ref-nav a[data-anchor]')
    if (!links.length) return
    var byAnchor = {}
    links.forEach(function (l) { byAnchor[l.getAttribute('data-anchor')] = l })
    var targets = $$('.method')
    var obs = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (!e.isIntersecting) return
        var anchor = e.target.id.replace(/^m-/, '')
        links.forEach(function (l) { l.classList.remove('active') })
        if (byAnchor[anchor]) {
          byAnchor[anchor].classList.add('active')
          var grp = byAnchor[anchor].closest('.ns-group')
          if (grp) grp.classList.remove('collapsed')
        }
      })
    }, { rootMargin: '-70px 0px -75% 0px' })
    targets.forEach(function (t) { obs.observe(t) })
  }

  /* ============================================================
     DIFF
     ============================================================ */
  function computeDiff(fromV, toV) {
    var a = DATA.surfaces[fromV], b = DATA.surfaces[toV]
    if (!a || !b) return { namespaces: [], added: 0, removed: 0, changed: 0 }
    var result = [], tot = { added: 0, removed: 0, changed: 0 }
    var keys = {}
    Object.keys(a.namespaces).forEach(function (k) { keys[k] = 1 })
    Object.keys(b.namespaces).forEach(function (k) { keys[k] = 1 })
    Object.keys(keys).forEach(function (key) {
      var am = (a.namespaces[key] && a.namespaces[key].methods) || {}
      var bm = (b.namespaces[key] && b.namespaces[key].methods) || {}
      var addedNames = Object.keys(bm).filter(function (n) { return !am[n] })
      var removedNames = Object.keys(am).filter(function (n) { return !bm[n] })
      var changed = Object.keys(bm).filter(function (n) { return am[n] && am[n].signature !== bm[n].signature })

      // rename detection: removed + added with identical params/return
      var renames = []
      var usedAdd = {}, usedRem = {}
      removedNames.forEach(function (rn) {
        addedNames.forEach(function (an) {
          if (usedAdd[an] || usedRem[rn]) return
          var rs = am[rn], as = bm[an]
          if (sameShape(rs, as)) { renames.push({ from: rn, to: an, oldSig: rs.signature, newSig: as.signature }); usedAdd[an] = 1; usedRem[rn] = 1 }
        })
      })
      var rows = []
      renames.forEach(function (r) { rows.push({ op: 'renamed', cls: 'rename', oldSig: r.oldSig, newSig: r.newSig }) })
      addedNames.filter(function (n) { return !usedAdd[n] }).forEach(function (n) { rows.push({ op: 'added', cls: 'add', newSig: bm[n].signature }); tot.added++ })
      removedNames.filter(function (n) { return !usedRem[n] }).forEach(function (n) { rows.push({ op: 'removed', cls: 'remove', oldSig: am[n].signature }); tot.removed++ })
      changed.forEach(function (n) { rows.push({ op: 'changed', cls: 'change', oldSig: am[n].signature, newSig: bm[n].signature }); tot.changed++ })
      tot.changed += renames.length
      if (rows.length) result.push({ key: key, interfaceName: (b.namespaces[key] || a.namespaces[key]).interfaceName, rows: rows })
    })
    return { namespaces: result, added: tot.added, removed: tot.removed, changed: tot.changed }
  }
  function sameShape(x, y) {
    if (x.returnType !== y.returnType) return false
    if (x.params.length !== y.params.length) return false
    for (var i = 0; i < x.params.length; i++) {
      if (x.params[i].type !== y.params[i].type || x.params[i].optional !== y.params[i].optional) return false
    }
    return true
  }

  var diffState = { from: null, to: null, mode: 'split' }

  /* ---------- token-level signature diff ---------- */
  function tokenizeSig(s) {
    // identifiers, whitespace runs, and single punctuation chars
    return s.match(/[A-Za-z_$][\w$]*|\s+|[^\s]/g) || []
  }
  // Longest-common-subsequence diff → ordered ops: {t:'same'|'del'|'add', v}
  function diffTokens(oldS, newS) {
    var a = tokenizeSig(oldS), b = tokenizeSig(newS)
    var n = a.length, m = b.length
    var dp = []
    for (var i = 0; i <= n; i++) { dp[i] = []; for (var j = 0; j <= m; j++) dp[i][j] = 0 }
    for (i = n - 1; i >= 0; i--) {
      for (j = m - 1; j >= 0; j--) {
        dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1])
      }
    }
    var ops = []
    i = 0; j = 0
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push({ t: 'same', v: a[i] }); i++; j++ }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', v: a[i] }); i++ }
      else { ops.push({ t: 'add', v: b[j] }); j++ }
    }
    while (i < n) { ops.push({ t: 'del', v: a[i] }); i++ }
    while (j < m) { ops.push({ t: 'add', v: b[j] }); j++ }
    return ops
  }
  function renderDiffBody(ops, keep) {
    // keep: 'old' emits same+del, 'new' emits same+add, 'uni' emits all
    return ops.map(function (o) {
      if (o.t === 'del' && keep === 'new') return ''
      if (o.t === 'add' && keep === 'old') return ''
      var cls = o.t === 'same' ? 'd-same' : o.t === 'del' ? 'd-del' : 'd-add'
      return '<span class="' + cls + '">' + esc(o.v) + '</span>'
    }).join('')
  }
  function diffLine(kind, gutter, html) {
    return '<div class="diff-line ' + kind + '"><span class="gutter">' + gutter + '</span><span class="body">' + html + '</span></div>'
  }
  function renderDiff() {
    var v = $('#view-diff')
    var versions = DATA.meta.surfaceVersions
    if (diffState.to == null) {
      diffState.to = versions[0]
      diffState.from = versions[1] || versions[0]
    }
    v.innerHTML = ''
    var head = el('div', 'page-head')
    head.innerHTML =
      '<div class="eyebrow">Surface comparison</div>' +
      '<h1>Version Diff</h1>' +
      '<p>What changed in the public method surface between two releases — extracted ' +
      'directly from the TypeScript interfaces at each version’s commit.</p>'
    v.appendChild(head)

    var controls = el('div', 'diff-controls')
    function opts(sel) {
      return versions.map(function (ver) {
        return '<option value="' + esc(ver) + '"' + (ver === sel ? ' selected' : '') + '>' + esc(ver) + '</option>'
      }).join('')
    }
    controls.innerHTML =
      '<div class="field"><label>From</label><select id="diff-from">' + opts(diffState.from) + '</select></div>' +
      '<div class="diff-arrow">→</div>' +
      '<div class="field"><label>To</label><select id="diff-to">' + opts(diffState.to) + '</select></div>' +
      '<div class="diff-mode" id="diff-mode">' +
        '<button data-mode="split"' + (diffState.mode === 'split' ? ' class="active"' : '') + '>Split</button>' +
        '<button data-mode="unified"' + (diffState.mode === 'unified' ? ' class="active"' : '') + '>Unified</button>' +
      '</div>' +
      '<div class="diff-summary" id="diff-summary"></div>'
    v.appendChild(controls)
    var out = el('div', 'diff-out')
    v.appendChild(out)

    function draw() {
      var d = computeDiff(diffState.from, diffState.to)
      $('#diff-summary').innerHTML =
        '<span class="diff-stat add">+' + d.added + ' added</span>' +
        '<span class="diff-stat change">~' + d.changed + ' changed</span>' +
        '<span class="diff-stat remove">−' + d.removed + ' removed</span>'
      out.innerHTML = ''
      if (!d.namespaces.length) {
        out.appendChild(el('div', 'diff-empty', diffState.from === diffState.to
          ? 'Select two different versions to compare.'
          : 'No surface changes between these versions.'))
        return
      }
      d.namespaces.forEach(function (ns) {
        var block = el('div', 'diff-ns')
        block.appendChild(el('h3', null, '<span class="key">' + esc(ns.key) + '</span> <span style="color:var(--faint);font-size:12px">' + esc(ns.interfaceName) + '</span>'))
        ns.rows.forEach(function (r) {
          var row = el('div', 'diff-row ' + r.cls)
          var sigs = ''
          if (r.oldSig && r.newSig) {
            // changed / renamed: token-level diff
            var ops = diffTokens(r.oldSig, r.newSig)
            if (diffState.mode === 'unified') {
              sigs = diffLine('uni', '~', renderDiffBody(ops, 'uni'))
            } else {
              sigs = diffLine('old', '−', renderDiffBody(ops, 'old')) +
                     diffLine('new', '+', renderDiffBody(ops, 'new'))
            }
          } else if (r.newSig) {
            // purely added: whole signature reads as new
            sigs = diffLine('new', '+', '<span class="d-add">' + esc(r.newSig) + '</span>')
          } else if (r.oldSig) {
            // purely removed
            sigs = diffLine('old', '−', '<span class="d-del">' + esc(r.oldSig) + '</span>')
          }
          row.innerHTML = '<div class="op">' + r.op + '</div><div class="sigs">' + sigs + '</div>'
          block.appendChild(row)
        })
        out.appendChild(block)
      })
    }
    $('#diff-from').addEventListener('change', function (e) { diffState.from = e.target.value; draw() })
    $('#diff-to').addEventListener('change', function (e) { diffState.to = e.target.value; draw() })
    $$('#diff-mode button').forEach(function (btn) {
      btn.addEventListener('click', function () {
        diffState.mode = btn.getAttribute('data-mode')
        $$('#diff-mode button').forEach(function (x) { x.classList.remove('active') })
        btn.classList.add('active')
        draw()
      })
    })
    draw()
  }

  /* ============================================================
     ERRORS
     ============================================================ */
  var errState = { q: '', sev: 'all' }
  function renderErrors() {
    var v = $('#view-errors')
    v.innerHTML = ''
    var head = el('div', 'page-head')
    head.innerHTML =
      '<div class="eyebrow">Failure contract · ' + DATA.meta.errorCodeCount + ' codes</div>' +
      '<h1>Error Codes</h1>' +
      '<p>Every <code>ApiFailure</code> carries a <code>{ code, severity, message }</code>. ' +
      'CX2-derived codes reuse the spec code directly; runtime concepts use the <code>APP*</code> namespace.</p>'
    v.appendChild(head)

    var toolbar = el('div', 'err-toolbar')
    toolbar.innerHTML =
      '<input class="err-filter" id="err-filter" placeholder="Filter by code, name, method…" value="' + esc(errState.q) + '" />' +
      '<div class="sev-toggle" id="sev-toggle">' +
        ['all', 'error', 'warning'].map(function (s) {
          return '<button data-sev="' + s + '"' + (errState.sev === s ? ' class="active"' : '') + '>' + s + '</button>'
        }).join('') +
      '</div>'
    v.appendChild(toolbar)
    var out = el('div', 'err-out')
    v.appendChild(out)

    function draw() {
      out.innerHTML = ''
      var q = errState.q.trim().toLowerCase()
      var catalogs = {}
      var order = []
      DATA.errorCodes.forEach(function (c) {
        if (errState.sev !== 'all' && c.severity !== errState.sev) return
        if (q && c.text.toLowerCase().indexOf(q) === -1) return
        if (!catalogs[c.catalog]) { catalogs[c.catalog] = { subtitle: c.catalogSubtitle, codes: [] }; order.push(c.catalog) }
        catalogs[c.catalog].codes.push(c)
      })
      if (!order.length) { out.appendChild(el('div', 'diff-empty', 'No error codes match.')); return }
      order.forEach(function (cat) {
        var group = catalogs[cat]
        var block = el('div', 'err-catalog')
        block.innerHTML = '<div class="cat-head"><h3>' + esc(cat) + '</h3>' +
          (group.subtitle ? '<p>' + esc(group.subtitle) + '</p>' : '') + '</div>'
        var grid = el('div', 'err-grid')
        group.codes.forEach(function (c) { grid.appendChild(renderErrCard(c)) })
        block.appendChild(grid)
        out.appendChild(block)
      })
      rewireInternalLinks(out)
    }

    $('#err-filter').addEventListener('input', function (e) { errState.q = e.target.value; draw() })
    $$('#sev-toggle button').forEach(function (b) {
      b.addEventListener('click', function () {
        errState.sev = b.getAttribute('data-sev')
        $$('#sev-toggle button').forEach(function (x) { x.classList.remove('active') })
        b.classList.add('active')
        draw()
      })
    })
    draw()
  }

  function renderErrCard(c) {
    var card = el('div', 'err-card')
    card.id = 'e-' + c.code
    var ret = ''
    if (c.returnedBy && c.returnedBy.length) {
      ret = '<div class="ec-ret"><span class="lbl">Returned by</span>' +
        c.returnedBy.map(function (name) {
          var anchor = guessAnchor(name)
          if (anchor) return '<a class="ret-chip" href="#reference/' + anchor + '">' + esc(name) + '</a>'
          return '<span class="ret-chip">' + esc(name) + '</span>'
        }).join('') + '</div>'
    }
    card.innerHTML =
      '<div class="ec-head">' +
        '<span class="ec-code">' + esc(c.code) + '</span>' +
        (c.name ? '<span class="ec-name">' + esc(c.name) + '</span>' : '') +
        (c.severity ? '<span class="badge ec-sev sev-' + esc(c.severity) + '">' + esc(c.severity) + '</span>' : '') +
      '</div>' +
      '<div class="ec-body prose">' + (c.descriptionHtml || '') + '</div>' +
      (c.cx2Spec ? '<div class="ec-cx2"><b>CX2</b> ' + esc(stripCx2(c.cx2Spec)) + '</div>' : '') +
      ret
    return card
  }
  function stripCx2(s) { return s.replace(/`/g, '').replace(/^\s+|\s+$/g, '') }
  var ANCHOR_INDEX = null
  function guessAnchor(name) {
    if (!ANCHOR_INDEX) {
      ANCHOR_INDEX = {}
      allMethods().forEach(function (x) { if (!ANCHOR_INDEX[x.method.name]) ANCHOR_INDEX[x.method.name] = x.method.anchor })
    }
    return ANCHOR_INDEX[name] || null
  }

  /* ============================================================
     ROUTER / TABS
     ============================================================ */
  var TABS = ['changelog', 'reference', 'diff', 'errors']
  var rendered = {}
  function ensureRendered(tab) {
    if (rendered[tab]) return
    rendered[tab] = true
    if (tab === 'changelog') renderChangelog()
    else if (tab === 'reference') renderReference()
    else if (tab === 'diff') renderDiff()
    else if (tab === 'errors') renderErrors()
  }
  function showTab(tab) {
    if (TABS.indexOf(tab) === -1) tab = 'changelog'
    ensureRendered(tab)
    TABS.forEach(function (t) {
      $('#view-' + t).classList.toggle('active', t === tab)
    })
    $$('#tabs button').forEach(function (b) {
      b.classList.toggle('active', b.getAttribute('data-tab') === tab)
    })
  }

  function route() {
    var hash = location.hash.replace(/^#/, '')
    var parts = hash.split('/')
    var tab = parts[0] || 'changelog'
    var sub = parts.slice(1).join('/')
    if (TABS.indexOf(tab) === -1) {
      // maybe a legacy anchor; default
      tab = 'changelog'
    }
    showTab(tab)
    if (sub) scrollToTarget(tab, sub)
    else window.scrollTo({ top: 0 })
  }
  function scrollToTarget(tab, sub) {
    var id = null
    if (tab === 'reference') id = 'm-' + sub
    else if (tab === 'errors') id = 'e-' + sub
    else if (tab === 'changelog') id = 'v-' + sub
    if (!id) return
    requestAnimationFrame(function () {
      var node = document.getElementById(id)
      if (!node) return
      node.scrollIntoView({ behavior: 'smooth', block: 'start' })
      node.classList.add('flash')
      setTimeout(function () { node.classList.remove('flash') }, 1400)
    })
  }

  // Intercept internal hash links so cross-tab jumps re-route cleanly.
  function rewireInternalLinks(root) {
    $$('a[href^="#"]', root).forEach(function (a) {
      if (a.__wired) return
      a.__wired = true
      a.addEventListener('click', function (e) {
        var href = a.getAttribute('href')
        if (location.hash === href) { e.preventDefault(); route() }
      })
    })
  }

  /* ============================================================
     SEARCH PALETTE
     ============================================================ */
  var SEARCH_INDEX = null
  function buildSearchIndex() {
    if (SEARCH_INDEX) return SEARCH_INDEX
    var idx = []
    allMethods().forEach(function (x) {
      idx.push({
        kind: 'method',
        title: x.method.name,
        sub: x.ns.name,
        hash: '#reference/' + x.method.anchor,
        text: (x.method.name + ' ' + x.ns.name + ' ' + x.method.text).toLowerCase()
      })
    })
    DATA.errorCodes.forEach(function (c) {
      idx.push({
        kind: 'error',
        title: c.code,
        sub: c.name || c.catalog,
        hash: '#errors/' + c.code,
        text: c.text.toLowerCase()
      })
    })
    DATA.versions.forEach(function (ver) {
      idx.push({
        kind: 'release',
        title: ver.version,
        sub: ver.date || '',
        hash: '#changelog/' + ver.version,
        text: (ver.version + ' ' + ver.sections.map(function (s) { return s.text }).join(' ')).toLowerCase()
      })
    })
    SEARCH_INDEX = idx
    return idx
  }
  function searchQuery(q) {
    q = q.trim().toLowerCase()
    var idx = buildSearchIndex()
    if (!q) return idx.filter(function (r) { return r.kind === 'method' }).slice(0, 8)
    var terms = q.split(/\s+/)
    var scored = []
    idx.forEach(function (r) {
      var score = 0, ok = true
      terms.forEach(function (t) {
        var ti = r.title.toLowerCase().indexOf(t)
        var xi = r.text.indexOf(t)
        if (ti === 0) score += 100
        else if (ti > -1) score += 40
        else if (xi > -1) score += 10
        else ok = false
      })
      if (ok) { if (r.kind === 'method') score += 5; scored.push({ r: r, score: score }) }
    })
    scored.sort(function (a, b) { return b.score - a.score })
    return scored.slice(0, 30).map(function (s) { return s.r })
  }
  var paletteSel = 0, paletteRows = []
  function openPalette() {
    $('#palette').classList.add('open')
    var inp = $('#palette-input')
    inp.value = ''; inp.focus()
    drawPalette('')
  }
  function closePalette() { $('#palette').classList.remove('open') }
  function drawPalette(q) {
    var res = searchQuery(q)
    paletteRows = res; paletteSel = 0
    var box = $('#palette-results')
    if (!res.length) { box.innerHTML = '<div class="palette-empty">No matches for “' + esc(q) + '”</div>'; return }
    box.innerHTML = res.map(function (r, i) {
      return '<div class="presult' + (i === 0 ? ' sel' : '') + '" data-hash="' + esc(r.hash) + '" data-i="' + i + '">' +
        '<span class="pr-kind ' + r.kind + '">' + r.kind + '</span>' +
        '<span class="pr-title">' + esc(r.title) + '</span>' +
        '<span class="pr-sub">' + esc(r.sub) + '</span></div>'
    }).join('')
    $$('#palette-results .presult').forEach(function (n) {
      n.addEventListener('click', function () { go(n.getAttribute('data-hash')) })
      n.addEventListener('mousemove', function () { setSel(parseInt(n.getAttribute('data-i'), 10)) })
    })
  }
  function setSel(i) {
    paletteSel = i
    $$('#palette-results .presult').forEach(function (n, j) { n.classList.toggle('sel', j === i) })
    var sel = $$('#palette-results .presult')[i]
    if (sel) sel.scrollIntoView({ block: 'nearest' })
  }
  function go(hash) { closePalette(); if (location.hash === hash) route(); else location.hash = hash }

  /* ============================================================
     FOOTER + INIT
     ============================================================ */
  function renderFooter() {
    var m = DATA.meta
    $('#footer').innerHTML =
      '<span>CyWeb App API</span><span class="sep">/</span>' +
      '<span>' + esc(m.apiTypesVersion) + '</span><span class="sep">/</span>' +
      '<span>' + m.methodCount + ' methods · ' + m.errorCodeCount + ' error codes</span>' +
      '<span class="sep">/</span><span>branch ' + esc(m.branch) + ' @ ' + esc(m.commit) + '</span>' +
      '<span class="sep">/</span><span>generated ' + esc((m.generatedAt || '').slice(0, 10)) + '</span>'
    $('#brand-sub').textContent = m.apiTypesVersion
  }

  function init() {
    initTheme()
    renderFooter()
    $$('#tabs button').forEach(function (b) {
      b.addEventListener('click', function () {
        var tab = b.getAttribute('data-tab')
        if (location.hash.replace(/^#/, '').split('/')[0] === tab) route()
        else location.hash = tab
      })
    })
    window.addEventListener('hashchange', route)
    if (!location.hash) location.hash = 'changelog'
    else route()

    // search palette wiring
    $('#search-trigger').addEventListener('click', openPalette)
    $('#palette').addEventListener('click', function (e) { if (e.target === $('#palette')) closePalette() })
    $('#palette-input').addEventListener('input', function (e) { drawPalette(e.target.value) })
    document.addEventListener('keydown', function (e) {
      var open = $('#palette').classList.contains('open')
      if (!open && (e.key === '/' || (e.key === 'k' && (e.metaKey || e.ctrlKey)))) {
        if (document.activeElement && /input|textarea|select/i.test(document.activeElement.tagName)) return
        e.preventDefault(); openPalette()
      } else if (open) {
        if (e.key === 'Escape') closePalette()
        else if (e.key === 'ArrowDown') { e.preventDefault(); setSel(Math.min(paletteSel + 1, paletteRows.length - 1)) }
        else if (e.key === 'ArrowUp') { e.preventDefault(); setSel(Math.max(paletteSel - 1, 0)) }
        else if (e.key === 'Enter') { e.preventDefault(); var r = paletteRows[paletteSel]; if (r) go(r.hash) }
      }
    })
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init)
  else init()
})()
</script>
</body>
</html>
