for graph traversal methods: Error Code When APP1 The specified network does not exist GL1 The specified node does not exist (node-scoped)","errorRefs":[]}]}]},{"name":"NetworkApi","moduleId":"cyweb/NetworkApi","key":"network","descriptionHtml":"\u003cp>Creates and deletes networks.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useNetworkApi } from &#39;cyweb/NetworkApi&#39;\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">interface CreateNetworkFromEdgeListProps {\n  name: string\n  description?: string\n  edgeList: Array&lt;[IdType, IdType, string?]&gt;   // [sourceLabel, targetLabel, edgeLabel?]\n  addToWorkspace?: boolean   // default: true\n}\n\ninterface CreateNetworkFromCx2Props {\n  cxData: Cx2\n  navigate?: boolean         // default: true  — set as current network\n  addToWorkspace?: boolean   // default: true\n}\n\ninterface DeleteNetworkOptions {\n  navigate?: boolean         // default: true  — switch to next available network\n}\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Methods","methods":[{"name":"createNetworkFromEdgeList","anchor":"network.createNetworkFromEdgeList","docSignature":"createNetworkFromEdgeList(props): ApiResult\u003c{ networkId, cyNetwork }>","tsSignature":"createNetworkFromEdgeList(props: CreateNetworkFromEdgeListProps): ApiResult\u003c{ networkId: IdType; cyNetwork: CyNetwork }>","descriptionHtml":"\u003cp>Creates a network from an edge list (pairs of node labels). Each unique label\nbecomes a node with its label stored in the \u003ccode>name\u003c/code> column. A passthrough mapping\nfor \u003ccode>NODE_LABEL → name\u003c/code> is created automatically.\u003c/p>\n\u003cp>The resulting \u003ccode>CyNetwork\u003c/code> is added to NetworkStore, TableStore, VisualStyleStore,\nViewModelStore, and NetworkSummaryStore. If \u003ccode>addToWorkspace: true\u003c/code> (the default),\nthe network is added to WorkspaceStore and set as the current network (firing\n\u003ccode>network:created\u003c/code> and \u003ccode>network:switched\u003c/code> events). Pass \u003ccode>addToWorkspace: false\u003c/code> to\ncreate the network without adding it to the workspace.\u003c/p>\n","text":"createNetworkFromEdgeList(props): ApiResult\u003c{ networkId, cyNetwork }> Creates a network from an edge list (pairs of node labels). Each unique label becomes a node with its label stored in the name column. A passthrough mapping for NODE_LABEL → name is created automatically. The resulting CyNetwork is added to NetworkStore, TableStore, VisualStyleStore, ViewModelStore, and NetworkSummaryStore. If addToWorkspace: true (the default), the network is added to WorkspaceStore and set as the current network (firing network:created and network:switched events). Pass addToWorkspace: false to create the network without adding it to the workspace.","errorRefs":[{"code":"APP9","condition":"\u003ccode>name\u003c/code> is empty or \u003ccode>edgeList\u003c/code> is empty"}]},{"name":"createNetworkFromNodeList","anchor":"network.createNetworkFromNodeList","docSignature":"createNetworkFromNodeList(networkId, nodeIds, edgeIds?, options?): ApiResult\u003c{ networkId, cyNetwork }>","tsSignature":"createNetworkFromNodeList(networkId: IdType, nodeIds: IdType[], edgeIds?: IdType[] | 'all', options?: CreateNetworkFromNodeListOptions): ApiResult\u003c{ networkId: IdType; cyNetwork: CyNetwork }>","descriptionHtml":"\u003cp>Creates a new network (subnetwork) from a subset of an existing network&#39;s\nnodes. Unlike \u003ccode>createNetworkFromEdgeList\u003c/code>, isolated (unconnected) nodes are\nallowed. Element IDs are preserved; table column schemas, the selected\nattribute rows, and node positions are copied from the source network.\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>edgeIds\u003c/code> omitted or \u003ccode>&#39;all&#39;\u003c/code> → induced subgraph: every source edge whose\nendpoints are both in \u003ccode>nodeIds\u003c/code> is included.\u003c/li>\n\u003cli>Explicit \u003ccode>edgeIds\u003c/code> → only those edges; each must connect nodes in \u003ccode>nodeIds\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>options\u003c/code>: \u003ccode>{ name?, description?, addToWorkspace? }\u003c/code> — name defaults to\n\u003ccode>Subnetwork of &lt;source name&gt;\u003c/code>; \u003ccode>addToWorkspace\u003c/code> defaults to \u003ccode>true\u003c/code> (pass\n\u003ccode>false\u003c/code> to opt out, matching \u003ccode>createNetworkFromEdgeList\u003c/code>).\u003c/li>\n\u003c/ul>\n","text":"createNetworkFromNodeList(networkId, nodeIds, edgeIds?, options?): ApiResult\u003c{ networkId, cyNetwork }> Creates a new network (subnetwork) from a subset of an existing network's nodes. Unlike createNetworkFromEdgeList , isolated (unconnected) nodes are allowed. Element IDs are preserved; table column schemas, the selected attribute rows, and node positions are copied from the source network. edgeIds omitted or 'all' → induced subgraph: every source edge whose endpoints are both in nodeIds is included. Explicit edgeIds → only those edges; each must connect nodes in nodeIds . options : { name?, description?, addToWorkspace? } — name defaults to Subnetwork of \u003csource name> ; addToWorkspace defaults to true (pass false to opt out, matching createNetworkFromEdgeList ).","errorRefs":[{"code":"APP1","condition":"Source network does not exist"},{"code":"GL1","condition":"A nodeId is not in the source network"},{"code":"GL2","condition":"An edgeId is not in the source network"},{"code":"APP9","condition":"\u003ccode>nodeIds\u003c/code> empty, or an edge endpoint not in \u003ccode>nodeIds\u003c/code>"}]},{"name":"createNetworkFromCx2","anchor":"network.createNetworkFromCx2","docSignature":"createNetworkFromCx2(props): ApiResult\u003c{ networkId, cyNetwork }>","tsSignature":"createNetworkFromCx2(props: CreateNetworkFromCx2Props): ApiResult\u003c{ networkId: IdType; cyNetwork: CyNetwork }>","descriptionHtml":"\u003cp>Creates a network from a CX2 document. Validates the CX2 structure before\nimporting. Infers network name and description from CX2 \u003ccode>networkAttributes\u003c/code>.\u003c/p>\n\u003cp>If \u003ccode>addToWorkspace: true\u003c/code>, adds to WorkspaceStore (fires \u003ccode>network:created\u003c/code>).\nIf \u003ccode>navigate: true\u003c/code>, sets as current network (fires \u003ccode>network:switched\u003c/code>).\u003c/p>\n","text":"createNetworkFromCx2(props): ApiResult\u003c{ networkId, cyNetwork }> Creates a network from a CX2 document. Validates the CX2 structure before importing. Infers network name and description from CX2 networkAttributes . If addToWorkspace: true , adds to WorkspaceStore (fires network:created ). If navigate: true , sets as current network (fires network:switched ).","errorRefs":[{"code":"APP8","condition":"CX2 structural validation failed"}]},{"name":"deleteNetwork","anchor":"network.deleteNetwork","docSignature":"deleteNetwork(networkId, options?): ApiResult","tsSignature":"deleteNetwork(networkId: IdType, options?: DeleteNetworkOptions): ApiResult","descriptionHtml":"\u003cp>Deletes a network from all stores. Fires \u003ccode>network:deleted\u003c/code>. If \u003ccode>navigate: true\u003c/code>\n(default), switches to the next available network.\u003c/p>\n","text":"deleteNetwork(networkId, options?): ApiResult Deletes a network from all stores. Fires network:deleted . If navigate: true (default), switches to the next available network.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"}]},{"name":"deleteCurrentNetwork","anchor":"network.deleteCurrentNetwork","docSignature":"deleteCurrentNetwork(options?): ApiResult","tsSignature":"deleteCurrentNetwork(options?: DeleteNetworkOptions): ApiResult","descriptionHtml":"\u003cp>Deletes the currently active network. Delegates to \u003ccode>deleteNetwork\u003c/code>.\u003c/p>\n","text":"deleteCurrentNetwork(options?): ApiResult Deletes the currently active network. Delegates to deleteNetwork .","errorRefs":[{"code":"APP2","condition":"No network is currently selected"}]},{"name":"deleteAllNetworks","anchor":"network.deleteAllNetworks","docSignature":"deleteAllNetworks(): ApiResult","tsSignature":"deleteAllNetworks(): ApiResult","descriptionHtml":"\u003cp>Deletes all networks from all stores. Clears workspace state.\u003c/p>\n\u003chr>\n","text":"deleteAllNetworks(): ApiResult Deletes all networks from all stores. Clears workspace state.","errorRefs":[]}]}]},{"name":"SelectionApi","moduleId":"cyweb/SelectionApi","key":"selection","descriptionHtml":"\u003cp>Manages node and edge selection state in network view models.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useSelectionApi } from &#39;cyweb/SelectionApi&#39;\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">interface SelectionState {\n  selectedNodes: IdType[]\n  selectedEdges: IdType[]\n}\n\u003c/code>\u003c/pre>\n\u003cp>All write methods trigger \u003ccode>selection:changed\u003c/code> via the Event Bus (the ViewModelStore\nsubscription in \u003ccode>initEventBus\u003c/code> fires automatically on store mutation).\u003c/p>\n","methods":[]},{"title":"Methods","methods":[{"name":"exclusiveSelect","anchor":"selection.exclusiveSelect","docSignature":"exclusiveSelect(networkId, nodeIds, edgeIds): ApiResult","tsSignature":"exclusiveSelect(networkId: IdType, nodeIds: IdType[], edgeIds: IdType[]): ApiResult","descriptionHtml":"\u003cp>Clears current selection and selects exactly the specified nodes and edges.\u003c/p>\n","text":"exclusiveSelect(networkId, nodeIds, edgeIds): ApiResult Clears current selection and selects exactly the specified nodes and edges.","errorRefs":[]},{"name":"additiveSelect","anchor":"selection.additiveSelect","docSignature":"additiveSelect(networkId, nodeIds, edgeIds): ApiResult","tsSignature":"additiveSelect(networkId: IdType, nodeIds: IdType[], edgeIds: IdType[]): ApiResult","descriptionHtml":"\u003cp>Adds the specified nodes and edges to the current selection.\u003c/p>\n","text":"additiveSelect(networkId, nodeIds, edgeIds): ApiResult Adds the specified nodes and edges to the current selection.","errorRefs":[]},{"name":"additiveDeselect","anchor":"selection.additiveDeselect","docSignature":"additiveDeselect(networkId, nodeIds, edgeIds): ApiResult","tsSignature":"additiveDeselect(networkId: IdType, nodeIds: IdType[], edgeIds: IdType[]): ApiResult","descriptionHtml":"\u003cp>Removes the specified nodes and edges from the current selection.\u003c/p>\n","text":"additiveDeselect(networkId, nodeIds, edgeIds): ApiResult Removes the specified nodes and edges from the current selection.","errorRefs":[]},{"name":"toggleSelected","anchor":"selection.toggleSelected","docSignature":"toggleSelected(networkId, nodeIds, edgeIds): ApiResult","tsSignature":"toggleSelected(networkId: IdType, nodeIds: IdType[], edgeIds: IdType[]): ApiResult","descriptionHtml":"\u003cp>Toggles the selection state of each specified node and edge.\u003c/p>\n","text":"toggleSelected(networkId, nodeIds, edgeIds): ApiResult Toggles the selection state of each specified node and edge.","errorRefs":[]},{"name":"clearSelection","anchor":"selection.clearSelection","docSignature":"clearSelection(networkId): ApiResult","tsSignature":"clearSelection(networkId: IdType): ApiResult","descriptionHtml":"\u003cp>Clears the entire selection (deselects all nodes and edges).\u003c/p>\n","text":"clearSelection(networkId): ApiResult Clears the entire selection (deselects all nodes and edges).","errorRefs":[]},{"name":"getSelection","anchor":"selection.getSelection","docSignature":"getSelection(networkId): ApiResult\u003cSelectionState>","tsSignature":"getSelection(networkId: IdType): ApiResult\u003cSelectionState>","descriptionHtml":"\u003cp>Returns the current selection state.\u003c/p>\n\u003cp>All methods return \u003ccode>APP1\u003c/code> if the view model for \u003ccode>networkId\u003c/code> is not found.\u003c/p>\n\u003chr>\n","text":"getSelection(networkId): ApiResult Returns the current selection state. All methods return APP1 if the view model for networkId is not found.","errorRefs":[]}]}]},{"name":"ViewportApi","moduleId":"cyweb/ViewportApi","key":"viewport","descriptionHtml":"\u003cp>Controls the viewport and node positions in the renderer.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useViewportApi } from &#39;cyweb/ViewportApi&#39;\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">/** JSON-serializable position map: nodeId → [x, y, z?] */\ntype PositionRecord = Record&lt;IdType, [number, number, number?]&gt;\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Methods","methods":[{"name":"fit","anchor":"viewport.fit","docSignature":"fit(networkId): Promise\u003cApiResult>","tsSignature":"fit(networkId: IdType): Promise\u003cApiResult>","descriptionHtml":"\u003cp>Fits the viewport to show all elements. Calls the renderer&#39;s registered \u003ccode>fit\u003c/code>\nfunction. This is async because it delegates to the renderer.\u003c/p>\n","text":"fit(networkId): Promise Fits the viewport to show all elements. Calls the renderer's registered fit function. This is async because it delegates to the renderer.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"APP5","condition":"Fit function not yet registered for this view"}]},{"name":"getNodePositions","anchor":"viewport.getNodePositions","docSignature":"getNodePositions(networkId, nodeIds?): ApiResult\u003c{ positions: PositionRecord; missing: IdType[] }>","tsSignature":"getNodePositions(networkId: IdType, nodeIds?: IdType[]): ApiResult\u003c{ positions: PositionRecord; missing: IdType[] }>","descriptionHtml":"\u003cp>Returns current \u003ccode>[x, y, z?]\u003c/code> positions. When \u003ccode>nodeIds\u003c/code> is omitted, every node&#39;s\nposition is returned. Requested ids with no view model entry are reported in\n\u003ccode>missing\u003c/code> rather than silently dropped (symmetric with \u003ccode>elementApi.getNodes\u003c/code>).\u003c/p>\n","text":"getNodePositions(networkId, nodeIds?): ApiResult\u003c{ positions: PositionRecord; missing: IdType[] }> Returns current [x, y, z?] positions. When nodeIds is omitted, every node's position is returned. Requested ids with no view model entry are reported in missing rather than silently dropped (symmetric with elementApi.getNodes ).","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"}]},{"name":"updateNodePositions","anchor":"viewport.updateNodePositions","docSignature":"updateNodePositions(networkId, positions): ApiResult","tsSignature":"updateNodePositions(networkId: IdType, positions: PositionRecord): ApiResult","descriptionHtml":"\u003cp>Bulk-updates node positions in the view model. Accepts a \u003ccode>PositionRecord\u003c/code>\n(plain object) and converts it internally to a \u003ccode>Map\u003c/code> before writing to the store.\nRejects (does not partially apply) if any key is not a node ID in the network.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Error Code\u003c/th>\n\u003cth>Condition\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>APP1\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>networkId\u003c/code> does not exist\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>GL1\u003c/code>\u003c/td>\n\u003ctd>A position key is not a node in the network\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n","text":"updateNodePositions(networkId, positions): ApiResult Bulk-updates node positions in the view model. Accepts a PositionRecord (plain object) and converts it internally to a Map before writing to the store. Rejects (does not partially apply) if any key is not a node ID in the network. Error Code Condition APP1 networkId does not exist GL1 A position key is not a node in the network","errorRefs":[]}]}]},{"name":"TableApi","moduleId":"cyweb/TableApi","key":"table","descriptionHtml":"\u003cp>Reads and writes node/edge table data.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useTableApi } from &#39;cyweb/TableApi&#39;\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">type AppTableType = &#39;node&#39; | &#39;edge&#39;\n\ninterface CellEdit {\n  id: IdType           // element ID (node or edge)\n  column: AttributeName\n  value: ValueType\n}\n\u003c/code>\u003c/pre>\n\u003cp>Write operations (\u003ccode>setValue\u003c/code>, \u003ccode>setValues\u003c/code>, \u003ccode>editRows\u003c/code>, etc.) trigger \u003ccode>data:changed\u003c/code>\nvia the Event Bus (the TableStore subscription in \u003ccode>initEventBus\u003c/code> fires automatically).\u003c/p>\n","methods":[]},{"title":"Methods","methods":[{"name":"getValue","anchor":"table.getValue","docSignature":"getValue(networkId, tableType, elementId, column): ApiResult\u003c{ value: ValueType }>","tsSignature":"getValue(networkId: IdType, tableType: AppTableType, elementId: IdType, column: AttributeName): ApiResult\u003c{ value: ValueType }>","descriptionHtml":"\u003cp>Returns the value of a single cell. On edge tables, the \u003ccode>source\u003c/code> and \u003ccode>target\u003c/code>\npseudo-columns are resolved from the network model (matching \u003ccode>getTable\u003c/code> /\n\u003ccode>getColumns\u003c/code>).\u003c/p>\n","text":"getValue(networkId, tableType, elementId, column): ApiResult\u003c{ value: ValueType }> Returns the value of a single cell. On edge tables, the source and target pseudo-columns are resolved from the network model (matching getTable / getColumns ).","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"GL1/GL2","condition":"\u003ccode>elementId\u003c/code> row not found (\u003ccode>GL1\u003c/code> node, \u003ccode>GL2\u003c/code> edge)"},{"code":"APP10","condition":"\u003ccode>column\u003c/code> is not declared and absent from the row"}]},{"name":"getRow","anchor":"table.getRow","docSignature":"getRow(networkId, tableType, elementId): ApiResult\u003c{ row: Record\u003cAttributeName, ValueType> }>","tsSignature":"getRow(networkId: IdType, tableType: AppTableType, elementId: IdType): ApiResult\u003c{ row: Record\u003cAttributeName, ValueType> }>","descriptionHtml":"\u003cp>Returns the full attribute row for a single element. Same error codes as \u003ccode>getValue\u003c/code>.\u003c/p>\n","text":"getRow(networkId, tableType, elementId): ApiResult\u003c{ row: Record\u003cAttributeName, ValueType> }> Returns the full attribute row for a single element. Same error codes as getValue .","errorRefs":[]},{"name":"createColumn","anchor":"table.createColumn","docSignature":"createColumn(networkId, tableType, columnName, dataType, defaultValue): ApiResult","tsSignature":"createColumn(networkId: IdType, tableType: AppTableType, columnName: string, dataType: ValueTypeName, defaultValue: ValueType): ApiResult","descriptionHtml":"\u003cp>Creates a new column with the given data type and default value. The\n\u003ccode>defaultValue\u003c/code> is validated against the declared \u003ccode>dataType\u003c/code>.\nTriggers \u003ccode>data:changed\u003c/code> with an empty \u003ccode>rowIds\u003c/code> array (schema-only change).\u003c/p>\n","text":"createColumn(networkId, tableType, columnName, dataType, defaultValue): ApiResult Creates a new column with the given data type and default value. The defaultValue is validated against the declared dataType . Triggers data:changed with an empty rowIds array (schema-only change).","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"FK1/FK2","condition":"\u003ccode>columnName\u003c/code> is \u003ccode>&quot;id&quot;\u003c/code> (\u003ccode>FK1\u003c/code> node table, \u003ccode>FK2\u003c/code> edge table)"},{"code":"A8","condition":"\u003ccode>columnName\u003c/code> is \u003ccode>&quot;s&quot;\u003c/code>/\u003ccode>&quot;t&quot;\u003c/code> on an edge table"},{"code":"AC6","condition":"\u003ccode>columnName\u003c/code> already exists on this table"},{"code":"A6","condition":"\u003ccode>defaultValue\u003c/code> is \u003ccode>null\u003c/code> or \u003ccode>undefined\u003c/code>"},{"code":"A1","condition":"\u003ccode>defaultValue\u003c/code> does not match the declared \u003ccode>dataType\u003c/code>"}]},{"name":"deleteColumn","anchor":"table.deleteColumn","docSignature":"deleteColumn(networkId, tableType, columnName): ApiResult","tsSignature":"deleteColumn(networkId: IdType, tableType: AppTableType, columnName: string): ApiResult","descriptionHtml":"\u003cp>Deletes a column. Cascades: removes any visual style mapping referencing the\ncolumn, and removes the column from the Table Browser display config.\nTriggers \u003ccode>data:changed\u003c/code> with an empty \u003ccode>rowIds\u003c/code> array.\u003c/p>\n","text":"deleteColumn(networkId, tableType, columnName): ApiResult Deletes a column. Cascades: removes any visual style mapping referencing the column, and removes the column from the Table Browser display config. Triggers data:changed with an empty rowIds array.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"APP10","condition":"\u003ccode>columnName\u003c/code> does not exist in the table"}]},{"name":"renameColumn","anchor":"table.renameColumn","docSignature":"renameColumn(networkId, tableType, currentName, newName): ApiResult","tsSignature":"renameColumn(networkId: IdType, tableType: AppTableType, currentName: string, newName: string): ApiResult","descriptionHtml":"\u003cp>Renames a column. Cascades: retargets any visual style mapping referencing the\ncolumn, and updates the Table Browser display config. Renaming to the current\nname is a no-op, not a collision. Triggers \u003ccode>data:changed\u003c/code> with an empty\n\u003ccode>rowIds\u003c/code> array.\u003c/p>\n","text":"renameColumn(networkId, tableType, currentName, newName): ApiResult Renames a column. Cascades: retargets any visual style mapping referencing the column, and updates the Table Browser display config. Renaming to the current name is a no-op, not a collision. Triggers data:changed with an empty rowIds array.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"FK1/FK2","condition":"\u003ccode>newName\u003c/code> is \u003ccode>&quot;id&quot;\u003c/code> (\u003ccode>FK1\u003c/code> node table, \u003ccode>FK2\u003c/code> edge table)"},{"code":"A8","condition":"\u003ccode>newName\u003c/code> is \u003ccode>&quot;s&quot;\u003c/code>/\u003ccode>&quot;t&quot;\u003c/code> on an edge table"},{"code":"APP10","condition":"\u003ccode>currentName\u003c/code> does not exist in the table"},{"code":"AC6","condition":"\u003ccode>newName\u003c/code> already exists and differs from \u003ccode>currentName\u003c/code>"}]},{"name":"setValue","anchor":"table.setValue","docSignature":"setValue(networkId, tableType, elementId, column, value): ApiResult","tsSignature":"setValue(networkId: IdType, tableType: AppTableType, elementId: IdType, column: AttributeName, value: ValueType): ApiResult","descriptionHtml":"\u003cp>Sets a single cell value. Triggers \u003ccode>data:changed\u003c/code>.\u003c/p>\n","text":"setValue(networkId, tableType, elementId, column, value): ApiResult Sets a single cell value. Triggers data:changed .","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"GL1/GL2","condition":"\u003ccode>elementId\u003c/code> not found (\u003ccode>GL1\u003c/code> node, \u003ccode>GL2\u003c/code> edge)"},{"code":"A1","condition":"\u003ccode>value\u003c/code> does not match the declared type of \u003ccode>column\u003c/code>"}]},{"name":"setValues","anchor":"table.setValues","docSignature":"setValues(networkId, tableType, cellEdits): ApiResult","tsSignature":"setValues(networkId: IdType, tableType: AppTableType, cellEdits: CellEdit[]): ApiResult","descriptionHtml":"\u003cp>Bulk cell edit. Converts \u003ccode>CellEdit[]\u003c/code> (app format, uses \u003ccode>id\u003c/code>) to the store format\n(uses \u003ccode>row\u003c/code>) internally. Rejects the whole batch (no partial application) if\nany edit fails validation. Triggers \u003ccode>data:changed\u003c/code>.\u003c/p>\n","text":"setValues(networkId, tableType, cellEdits): ApiResult Bulk cell edit. Converts CellEdit[] (app format, uses id ) to the store format (uses row ) internally. Rejects the whole batch (no partial application) if any edit fails validation. Triggers data:changed .","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"GL1/GL2","condition":"Any edit&#39;s \u003ccode>id\u003c/code> not found (\u003ccode>GL1\u003c/code> node, \u003ccode>GL2\u003c/code> edge)"},{"code":"A1","condition":"Any edit&#39;s \u003ccode>value\u003c/code> does not match its column&#39;s declared type"}]},{"name":"editRows","anchor":"table.editRows","docSignature":"editRows(networkId, tableType, rows): ApiResult","tsSignature":"editRows(networkId: IdType, tableType: AppTableType, rows: Record\u003cIdType, Record\u003cAttributeName, ValueType>>): ApiResult","descriptionHtml":"\u003cp>Bulk row edit via a \u003ccode>Record&lt;IdType, Record&lt;AttributeName, ValueType&gt;&gt;\u003c/code>.\nConverts to \u003ccode>Map\u003c/code> internally. Rejects the whole batch if any value fails\nvalidation. Triggers \u003ccode>data:changed\u003c/code>.\u003c/p>\n","text":"editRows(networkId, tableType, rows): ApiResult Bulk row edit via a Record\u003cIdType, Record\u003cAttributeName, ValueType>> . Converts to Map internally. Rejects the whole batch if any value fails validation. Triggers data:changed .","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"GL1/GL2","condition":"Any row&#39;s key not found (\u003ccode>GL1\u003c/code> node, \u003ccode>GL2\u003c/code> edge)"},{"code":"A1","condition":"Any value does not match its column&#39;s declared type"}]},{"name":"applyValueToElements","anchor":"table.applyValueToElements","docSignature":"applyValueToElements(networkId, tableType, columnName, value, elementIds?): ApiResult","tsSignature":"applyValueToElements(networkId: IdType, tableType: AppTableType, columnName: string, value: ValueType, elementIds?: IdType[]): ApiResult","descriptionHtml":"\u003cp>Sets the same value for all specified elements (or all elements if \u003ccode>elementIds\u003c/code>\nis omitted). Triggers \u003ccode>data:changed\u003c/code>.\u003c/p>\n","text":"applyValueToElements(networkId, tableType, columnName, value, elementIds?): ApiResult Sets the same value for all specified elements (or all elements if elementIds is omitted). Triggers data:changed .","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"GL1/GL2","condition":"An \u003ccode>elementIds\u003c/code> entry not found (\u003ccode>GL1\u003c/code> node, \u003ccode>GL2\u003c/code> edge)"},{"code":"A1","condition":"\u003ccode>value\u003c/code> does not match the declared type of \u003ccode>columnName\u003c/code>"}]}]},{"title":"Bulk Read","methods":[{"name":"getColumns","anchor":"table.getColumns","docSignature":"getColumns(networkId, tableType): ApiResult\u003c{ columns: ColumnInfo[] }>","tsSignature":"getColumns(networkId: IdType, tableType: AppTableType): ApiResult\u003c{ columns: ColumnInfo[] }>","descriptionHtml":"\u003cp>Returns only the column definitions (the table schema) without loading any\nrows. Prefer this over \u003ccode>getTable\u003c/code> when you only need the schema — on large\ntables \u003ccode>getTable\u003c/code> materializes every row. Edge tables include the \u003ccode>source\u003c/code>\nand \u003ccode>target\u003c/code> pseudo-columns, matching \u003ccode>getTable\u003c/code>&#39;s output.\u003c/p>\n","text":"getColumns(networkId, tableType): ApiResult\u003c{ columns: ColumnInfo[] }> Returns only the column definitions (the table schema) without loading any rows. Prefer this over getTable when you only need the schema — on large tables getTable materializes every row. Edge tables include the source and target pseudo-columns, matching getTable 's output.","errorRefs":[]},{"name":"getTable","anchor":"table.getTable","docSignature":"getTable(networkId, tableType, options?): ApiResult\u003c{ columns, rows }>","tsSignature":"getTable(networkId: IdType, tableType: AppTableType, options?: GetTableOptions): ApiResult\u003c{ columns: ColumnInfo[] rows: Array\u003cRecord\u003cstring, ValueType>> }>","descriptionHtml":"\u003cp>Returns all columns (with type metadata) and all rows for the given table.\nBy default a leading \u003ccode>id\u003c/code> column is prepended and every row carries an \u003ccode>id\u003c/code>\nfield, so rows are round-trippable back to their nodes/edges. For edge tables,\n\u003ccode>source\u003c/code> and \u003ccode>target\u003c/code> columns follow (read from the network model, not from the\ntable itself).\u003c/p>\n\u003cp>\u003cstrong>Options:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>columns?: string[]\u003c/code> — return only these columns (omit = all)\u003c/li>\n\u003cli>\u003ccode>includeId?: boolean\u003c/code> — include the element \u003ccode>id\u003c/code> column and per-row \u003ccode>id\u003c/code>\nfield. Default: \u003ccode>true\u003c/code>. Set \u003ccode>false\u003c/code> for a data-only result.\u003c/li>\n\u003c/ul>\n\u003cpre>\u003ccode class=\"language-typescript\">const result = tableApi.getTable(networkId, &#39;node&#39;)\nif (result.success) {\n  result.data.columns // [{ name: &#39;id&#39;, type: &#39;string&#39; }, { name: &#39;name&#39;, type: &#39;string&#39; }, { name: &#39;degree&#39;, type: &#39;long&#39; }]\n  result.data.rows    // [{ id: &#39;n1&#39;, name: &#39;TP53&#39;, degree: 42 }, ...]\n}\n\u003c/code>\u003c/pre>\n","text":"getTable(networkId, tableType, options?): ApiResult\u003c{ columns, rows }> Returns all columns (with type metadata) and all rows for the given table. By default a leading id column is prepended and every row carries an id field, so rows are round-trippable back to their nodes/edges. For edge tables, source and target columns follow (read from the network model, not from the table itself). Options: columns?: string[] — return only these columns (omit = all) includeId?: boolean — include the element id column and per-row id field. Default: true . Set false for a data-only result. const result = tableApi.getTable(networkId, 'node') if (result.success) { result.data.columns // [{ name: 'id', type: 'string' }, { name: 'name', type: 'string' }, { name: 'degree', type: 'long' }] result.data.rows // [{ id: 'n1', name: 'TP53', degree: 42 }, ...] }","errorRefs":[]}]},{"title":"TSV I/O","methods":[{"name":"exportTableToTsv","anchor":"table.exportTableToTsv","docSignature":"exportTableToTsv(networkId, tableType, options?): ApiResult\u003c{ tsvText }>","tsSignature":"exportTableToTsv(networkId: IdType, tableType: AppTableType, options?: ExportTableToTsvOptions): ApiResult\u003c{ tsvText: string }>","descriptionHtml":"\u003cp>Serializes the table to a tab-separated values string. Useful for interop with\npandas, R, and other external tools.\u003c/p>\n\u003cp>\u003cstrong>Options:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>columns?: string[]\u003c/code> — export only these columns\u003c/li>\n\u003cli>\u003ccode>includeTypeHeader?: boolean\u003c/code> — \u003ccode>true\u003c/code> → \u003ccode>name:string\\tscore:double\u003c/code> (Cytoscape\nDesktop format for lossless round-trip). Default: \u003ccode>false\u003c/code> (plain column names).\u003c/li>\n\u003cli>\u003ccode>includeId?: boolean\u003c/code> — emit a leading \u003ccode>id\u003c/code> column holding each element&#39;s id.\nDefault: \u003ccode>true\u003c/code>, so the export round-trips through \u003ccode>importTableFromTsv\u003c/code> (whose\ndefault \u003ccode>keyColumn\u003c/code> is \u003ccode>id\u003c/code>) with no manual id insertion. Set \u003ccode>false\u003c/code> for a\ndata-only export.\u003c/li>\n\u003c/ul>\n\u003cp>For edge tables, \u003ccode>source\u003c/code> and \u003ccode>target\u003c/code> columns are always included.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">const result = tableApi.exportTableToTsv(networkId, &#39;node&#39;)\nif (result.success) {\n  console.log(result.data.tsvText)\n  // id\\tname\\tscore\n  // n1\\tTP53\\t0.95\n  // n2\\tBRCA1\\t0.73\n}\n\u003c/code>\u003c/pre>\n","text":"exportTableToTsv(networkId, tableType, options?): ApiResult\u003c{ tsvText }> Serializes the table to a tab-separated values string. Useful for interop with pandas, R, and other external tools. Options: columns?: string[] — export only these columns includeTypeHeader?: boolean — true → name:string\\tscore:double (Cytoscape Desktop format for lossless round-trip). Default: false (plain column names). includeId?: boolean — emit a leading id column holding each element's id. Default: true , so the export round-trips through importTableFromTsv (whose default keyColumn is id ) with no manual id insertion. Set false for a data-only export. For edge tables, source and target columns are always included. const result = tableApi.exportTableToTsv(networkId, 'node') if (result.success) { console.log(result.data.tsvText) // id\\tname\\tscore // n1\\tTP53\\t0.95 // n2\\tBRCA1\\t0.73 }","errorRefs":[]},{"name":"importTableFromTsv","anchor":"table.importTableFromTsv","docSignature":"importTableFromTsv(networkId, tableType, tsvText, options?): ApiResult\u003c{ rowCount, newColumns, skippedRows, skippedCells }>","tsSignature":"importTableFromTsv(networkId: IdType, tableType: AppTableType, tsvText: string, options?: ImportTableFromTsvOptions): ApiResult\u003c{ rowCount: number newColumns: string[] /** TSV key values that matched no element in the network */ skippedRows: string[] /** * Non-empty cells whose value could not be parsed as the column's * type. Skipped instead of being silently coerced. */ skippedCells: Array\u003c{ key: string; column: string; value: string }> }>","descriptionHtml":"\u003cp>Parses a TSV string and writes data into the table. New column names are\nvalidated up front (before anything is mutated), so a forbidden name fails the\nimport cleanly instead of leaving some columns created; valid missing columns\nare then created as needed. Matches rows by resolving the key column&#39;s value to\nelement IDs — TSV rows whose key value matches no element are skipped (never\ncreating orphaned rows) and their key values are returned in \u003ccode>skippedRows\u003c/code>.\u003c/p>\n\u003cp>Cell values are parsed strictly against the column&#39;s type, with no coercion\n(matching \u003ccode>setValue\u003c/code>/\u003ccode>setValues\u003c/code>):\u003c/p>\n\u003cul>\n\u003cli>A non-empty cell that cannot be parsed as its column type is \u003cstrong>skipped\u003c/strong> and\nreported in \u003ccode>skippedCells\u003c/code> (as \u003ccode>{ key, column, value }\u003c/code>) rather than coerced\nto \u003ccode>0\u003c/code>/\u003ccode>false\u003c/code>.\u003c/li>\n\u003cli>An empty cell for a non-string column is treated as &quot;no value provided&quot; and\nleaves the existing attribute untouched.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Options:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>keyColumn?: string\u003c/code> — column in the TSV to use as element ID (default: \u003ccode>&#39;id&#39;\u003c/code>)\u003c/li>\n\u003c/ul>\n\u003cp>Auto-detects typed headers (\u003ccode>name:string\\tscore:double\u003c/code>) if present. Otherwise\ninfers types from the first few data rows.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">const tsv = &#39;id\\tcluster\\tpagerank\\nn1\\t0\\t0.042\\nn2\\t1\\t0.015&#39;\nconst result = tableApi.importTableFromTsv(networkId, &#39;node&#39;, tsv)\nif (result.success) {\n  console.log(result.data.newColumns)   // [&#39;cluster&#39;, &#39;pagerank&#39;]\n  console.log(result.data.rowCount)     // 2\n  console.log(result.data.skippedRows)  // [] — no unmatched key values\n  console.log(result.data.skippedCells) // [] — no unparseable cells\n}\n\u003c/code>\u003c/pre>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Error Code\u003c/th>\n\u003cth>Condition\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>APP1\u003c/code>\u003c/td>\n\u003ctd>Table record for \u003ccode>networkId\u003c/code> not found\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>APP9\u003c/code>\u003c/td>\n\u003ctd>TSV has &lt; 2 lines or key column missing\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>FK1\u003c/code>/\u003ccode>FK2\u003c/code>\u003c/td>\n\u003ctd>A new column is named \u003ccode>&quot;id&quot;\u003c/code> (\u003ccode>FK1\u003c/code> node, \u003ccode>FK2\u003c/code> edge)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>A8\u003c/code>\u003c/td>\n\u003ctd>A new column is named \u003ccode>&quot;s&quot;\u003c/code>/\u003ccode>&quot;t&quot;\u003c/code> on an edge table\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>All methods in this API return \u003ccode>APP1\u003c/code> if the table record for \u003ccode>networkId\u003c/code> is not found.\u003c/p>\n\u003chr>\n","text":"importTableFromTsv(networkId, tableType, tsvText, options?): ApiResult\u003c{ rowCount, newColumns, skippedRows, skippedCells }> Parses a TSV string and writes data into the table. New column names are validated up front (before anything is mutated), so a forbidden name fails the import cleanly instead of leaving some columns created; valid missing columns are then created as needed. Matches rows by resolving the key column's value to element IDs — TSV rows whose key value matches no element are skipped (never creating orphaned rows) and their key values are returned in skippedRows . Cell values are parsed strictly against the column's type, with no coercion (matching setValue / setValues ): A non-empty cell that cannot be parsed as its column type is skipped and reported in skippedCells (as { key, column, value } ) rather than coerced to 0 / false . An empty cell for a non-string column is treated as \"no value provided\" and leaves the existing attribute untouched. Options: keyColumn?: string — column in the TSV to use as element ID (default: 'id' ) Auto-detects typed headers ( name:string\\tscore:double ) if present. Otherwise infers types from the first few data rows. const tsv = 'id\\tcluster\\tpagerank\\nn1\\t0\\t0.042\\nn2\\t1\\t0.015' const result = tableApi.importTableFromTsv(networkId, 'node', tsv) if (result.success) { console.log(result.data.newColumns) // ['cluster', 'pagerank'] console.log(result.data.rowCount) // 2 console.log(result.data.skippedRows) // [] — no unmatched key values console.log(result.data.skippedCells) // [] — no unparseable cells } Error Code Condition APP1 Table record for networkId not found APP9 TSV has \u003c 2 lines or key column missing FK1 / FK2 A new column is named \"id\" ( FK1 node, FK2 edge) A8 A new column is named \"s\" / \"t\" on an edge table All methods in this API return APP1 if the table record for networkId is not found.","errorRefs":[]}]}]},{"name":"VisualStyleApi","moduleId":"cyweb/VisualStyleApi","key":"visualStyle","descriptionHtml":"\u003cp>Reads and modifies visual style properties.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useVisualStyleApi } from &#39;cyweb/VisualStyleApi&#39;\nimport { VisualPropertyName } from &#39;cyweb/ApiTypes&#39;\n\u003c/code>\u003c/pre>\n\u003cp>All write methods trigger \u003ccode>style:changed\u003c/code> via the Event Bus (the VisualStyleStore\nsubscription in \u003ccode>initEventBus\u003c/code> fires on any property change).\u003c/p>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">/** One visual property&#39;s identity and scope, from getVisualProperties(). */\ninterface VisualPropertyInfo {\n  name: VisualPropertyName\n  group: &#39;node&#39; | &#39;edge&#39; | &#39;network&#39;\n  type: VisualPropertyValueTypeName   // e.g. &#39;color&#39;, &#39;number&#39;, &#39;string&#39;\n  hasMapping: boolean                 // true when the property has a mapping\n}\n\n/** Options bundle for createContinuousMapping. */\ninterface CreateContinuousMappingOptions {\n  vpType: VisualPropertyValueTypeName             // property&#39;s value type\n  attribute: AttributeName                        // source table column\n  attributeValues: ValueType[]                    // numeric anchors (min…max)\n  attributeType: ValueTypeName                    // declared type of the column\n  controlPoints?: ContinuousFunctionControlPoint[] // override interpolation points\n  ltMinVpValue?: VisualPropertyValueType          // value below the minimum anchor\n  gtMaxVpValue?: VisualPropertyValueType          // value above the maximum anchor\n}\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Read Methods","methods":[{"name":"getVisualProperties","anchor":"visualStyle.getVisualProperties","docSignature":"getVisualProperties(networkId): ApiResult\u003c{ properties: VisualPropertyInfo[] }>","tsSignature":"getVisualProperties(networkId: IdType): ApiResult\u003c{ properties: VisualPropertyInfo[] }>","descriptionHtml":"\u003cp>Lists every visual property in the network&#39;s style, each with its \u003ccode>name\u003c/code>,\n\u003ccode>group\u003c/code> (node/edge/network), value \u003ccode>type\u003c/code>, and whether it currently has a\nmapping (\u003ccode>hasMapping\u003c/code>).\u003c/p>\n","text":"getVisualProperties(networkId): ApiResult\u003c{ properties: VisualPropertyInfo[] }> Lists every visual property in the network's style, each with its name , group (node/edge/network), value type , and whether it currently has a mapping ( hasMapping ).","errorRefs":[]},{"name":"getDefault","anchor":"visualStyle.getDefault","docSignature":"getDefault(networkId, vpName): ApiResult\u003c{ value }>","tsSignature":"getDefault(networkId: IdType, vpName: VisualPropertyName): ApiResult\u003c{ value: VisualPropertyValueType }>","descriptionHtml":"\u003cp>Reads the default value of a visual property.\u003c/p>\n","text":"getDefault(networkId, vpName): ApiResult\u003c{ value }> Reads the default value of a visual property.","errorRefs":[]},{"name":"getBypass","anchor":"visualStyle.getBypass","docSignature":"getBypass(networkId, vpName, elementId): ApiResult\u003c{ value }>","tsSignature":"getBypass(networkId: IdType, vpName: VisualPropertyName, elementId: IdType): ApiResult\u003c{ value: VisualPropertyValueType | undefined }>","descriptionHtml":"\u003cp>Reads a single element&#39;s bypass for a property. \u003ccode>value\u003c/code> is \u003ccode>undefined\u003c/code> when the\nelement has no bypass for that property.\u003c/p>\n","text":"getBypass(networkId, vpName, elementId): ApiResult\u003c{ value }> Reads a single element's bypass for a property. value is undefined when the element has no bypass for that property.","errorRefs":[]},{"name":"getBypasses","anchor":"visualStyle.getBypasses","docSignature":"getBypasses(networkId, vpName): ApiResult\u003c{ bypasses: Record\u003celementId, value> }>","tsSignature":"getBypasses(networkId: IdType, vpName: VisualPropertyName): ApiResult\u003c{ bypasses: Record\u003cIdType, VisualPropertyValueType> }>","descriptionHtml":"\u003cp>Reads every bypass set for a property, keyed by element id. Returns an empty\nobject when the property has no bypasses.\u003c/p>\n","text":"getBypasses(networkId, vpName): ApiResult\u003c{ bypasses: Record\u003celementId, value> }> Reads every bypass set for a property, keyed by element id. Returns an empty object when the property has no bypasses.","errorRefs":[]},{"name":"getMapping","anchor":"visualStyle.getMapping","docSignature":"getMapping(networkId, vpName): ApiResult\u003c{ mapping }>","tsSignature":"getMapping(networkId: IdType, vpName: VisualPropertyName): ApiResult\u003c{ mapping: VisualMappingFunction | undefined }>","descriptionHtml":"\u003cp>Reads the mapping installed on a property. \u003ccode>mapping\u003c/code> is \u003ccode>undefined\u003c/code> when the\nproperty has no mapping.\u003c/p>\n\u003cp>\u003cstrong>Common errors for read methods:\u003c/strong>\u003c/p>\n","text":"getMapping(networkId, vpName): ApiResult\u003c{ mapping }> Reads the mapping installed on a property. mapping is undefined when the property has no mapping. Common errors for read methods:","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> has no visual style"},{"code":"APP9","condition":"\u003ccode>vpName\u003c/code> is not a known visual property (the \u003ccode>vpName\u003c/code>-scoped reads only; \u003ccode>getVisualProperties\u003c/code> returns only \u003ccode>APP1\u003c/code>)"}]}]},{"title":"Write Methods","methods":[{"name":"setDefault","anchor":"visualStyle.setDefault","docSignature":"setDefault(networkId, vpName, vpValue): ApiResult","tsSignature":"setDefault(networkId: IdType, vpName: VisualPropertyName, vpValue: VisualPropertyValueType): ApiResult","descriptionHtml":"\u003cp>Sets the default value for a visual property (applies to all elements without a\nbypass or mapping). \u003ccode>vpValue\u003c/code> is validated against the property&#39;s declared value\ntype before being written.\u003c/p>\n","text":"setDefault(networkId, vpName, vpValue): ApiResult Sets the default value for a visual property (applies to all elements without a bypass or mapping). vpValue is validated against the property's declared value type before being written.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"APP9","condition":"\u003ccode>vpName\u003c/code> is not a known visual property"},{"code":"VP1/VP2/VP3/VP4/VP5/VP6/VP7/VP9/VP10","condition":"\u003ccode>vpValue\u003c/code> invalid for the property&#39;s value type (see \u003ca href=\"./ErrorCodes.md\">ErrorCodes.md\u003c/a>)"}]},{"name":"setDefaults","anchor":"visualStyle.setDefaults","docSignature":"setDefaults(networkId, defaults): ApiResult","tsSignature":"setDefaults(networkId: IdType, defaults: Partial\u003cRecord\u003cVisualPropertyName, VisualPropertyValueType>>): ApiResult","descriptionHtml":"\u003cp>Sets several visual-property defaults in one call, where \u003ccode>defaults\u003c/code> is a\n\u003ccode>Partial&lt;Record&lt;VisualPropertyName, value&gt;&gt;\u003c/code>. Every entry is validated first\n(property existence and value type); if any is invalid, \u003cstrong>nothing\u003c/strong> is applied,\nso a bad value can&#39;t leave a half-updated style. Same error codes as\n\u003ccode>setDefault\u003c/code>.\u003c/p>\n","text":"setDefaults(networkId, defaults): ApiResult Sets several visual-property defaults in one call, where defaults is a Partial\u003cRecord\u003cVisualPropertyName, value>> . Every entry is validated first (property existence and value type); if any is invalid, nothing is applied, so a bad value can't leave a half-updated style. Same error codes as setDefault .","errorRefs":[]},{"name":"setBypass","anchor":"visualStyle.setBypass","docSignature":"setBypass(networkId, vpName, elementIds, vpValue): ApiResult","tsSignature":"setBypass(networkId: IdType, vpName: VisualPropertyName, elementIds: IdType[], vpValue: VisualPropertyValueType): ApiResult","descriptionHtml":"\u003cp>Sets a per-element override. \u003ccode>elementIds\u003c/code> must be non-empty and must match the\nproperty&#39;s node/edge scope; network-scoped properties cannot be bypassed.\u003c/p>\n","text":"setBypass(networkId, vpName, elementIds, vpValue): ApiResult Sets a per-element override. elementIds must be non-empty and must match the property's node/edge scope; network-scoped properties cannot be bypassed.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"APP9","condition":"\u003ccode>elementIds\u003c/code> is empty, or \u003ccode>vpName\u003c/code> is not a known property"},{"code":"BV5","condition":"\u003ccode>vpName\u003c/code> is a network-scoped property"},{"code":"BV1","condition":"An \u003ccode>elementIds\u003c/code> entry does not exist in the network"},{"code":"BV2","condition":"An \u003ccode>elementIds\u003c/code> entry doesn&#39;t match the property&#39;s node/edge scope"},{"code":"VP1–VP10","condition":"\u003ccode>vpValue\u003c/code> invalid for the property&#39;s value type (same codes as \u003ccode>setDefault\u003c/code>)"}]},{"name":"setBypasses","anchor":"visualStyle.setBypasses","docSignature":"setBypasses(networkId, elementIds, bypasses): ApiResult","tsSignature":"setBypasses(networkId: IdType, elementIds: IdType[], bypasses: Partial\u003cRecord\u003cVisualPropertyName, VisualPropertyValueType>>): ApiResult","descriptionHtml":"\u003cp>Sets several visual-property bypasses on the same \u003ccode>elementIds\u003c/code> in one call —\ne.g. highlighting nodes with color + border + size at once. \u003ccode>bypasses\u003c/code> is a\n\u003ccode>Partial&lt;Record&lt;VisualPropertyName, value&gt;&gt;\u003c/code>. Every property is validated first\n(existence, node/edge scope, value type, and element existence); if any is\ninvalid, \u003cstrong>nothing\u003c/strong> is applied. Same error codes as \u003ccode>setBypass\u003c/code>.\u003c/p>\n","text":"setBypasses(networkId, elementIds, bypasses): ApiResult Sets several visual-property bypasses on the same elementIds in one call — e.g. highlighting nodes with color + border + size at once. bypasses is a Partial\u003cRecord\u003cVisualPropertyName, value>> . Every property is validated first (existence, node/edge scope, value type, and element existence); if any is invalid, nothing is applied. Same error codes as setBypass .","errorRefs":[]},{"name":"deleteBypass","anchor":"visualStyle.deleteBypass","docSignature":"deleteBypass(networkId, vpName, elementIds): ApiResult","tsSignature":"deleteBypass(networkId: IdType, vpName: VisualPropertyName, elementIds: IdType[]): ApiResult","descriptionHtml":"\u003cp>Removes per-element overrides. Intentionally unguarded against non-existent\nelement IDs, so cleanup of stale bypasses (e.g. after external deletion) always\nsucceeds.\u003c/p>\n","text":"deleteBypass(networkId, vpName, elementIds): ApiResult Removes per-element overrides. Intentionally unguarded against non-existent element IDs, so cleanup of stale bypasses (e.g. after external deletion) always succeeds.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"}]},{"name":"createDiscreteMapping","anchor":"visualStyle.createDiscreteMapping","docSignature":"createDiscreteMapping(networkId, vpName, attribute, attributeType, mapping?): ApiResult","tsSignature":"createDiscreteMapping(networkId: IdType, vpName: VisualPropertyName, attribute: AttributeName, attributeType: ValueTypeName, mapping?: Record\u003cstring, VisualPropertyValueType>): ApiResult","descriptionHtml":"\u003cp>Creates a discrete (lookup-table) mapping for \u003ccode>vpName\u003c/code> based on the specified\nnode/edge attribute. \u003ccode>mapping\u003c/code> is an optional \u003ccode>Record&lt;string, VisualPropertyValueType&gt;\u003c/code>\nof attribute-value keys (stringified; parsed back to \u003ccode>integer\u003c/code>/\u003ccode>long\u003c/code>/\u003ccode>double\u003c/code> per\n\u003ccode>attributeType\u003c/code>) to visual property values.\u003c/p>\n","text":"createDiscreteMapping(networkId, vpName, attribute, attributeType, mapping?): ApiResult Creates a discrete (lookup-table) mapping for vpName based on the specified node/edge attribute. mapping is an optional Record\u003cstring, VisualPropertyValueType> of attribute-value keys (stringified; parsed back to integer / long / double per attributeType ) to visual property values.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"MC1","condition":"\u003ccode>vpName\u003c/code> is a network-scoped property"},{"code":"MI1","condition":"\u003ccode>attribute\u003c/code> is not declared in the matching node/edge table"},{"code":"MI2","condition":"\u003ccode>attributeType\u003c/code> does not match the declared column type"}]},{"name":"createContinuousMapping","anchor":"visualStyle.createContinuousMapping","docSignature":"createContinuousMapping(networkId, vpName, options): ApiResult","tsSignature":"createContinuousMapping(networkId: IdType, vpName: VisualPropertyName, options: CreateContinuousMappingOptions): ApiResult","descriptionHtml":"\u003cp>Creates a continuous (interpolated) mapping. \u003ccode>options\u003c/code> is a\n\u003ccode>CreateContinuousMappingOptions\u003c/code> bundle (see \u003ca href=\"#types\">Types\u003c/a>) — the correlated\nvalues are passed as one object rather than positionally.\n\u003ccode>options.attributeValues\u003c/code> defines the control point values on the data axis. By\ndefault, \u003ccode>min\u003c/code>/\u003ccode>max\u003c/code>/\u003ccode>controlPoints\u003c/code>/\u003ccode>ltMinVpValue\u003c/code>/\u003ccode>gtMaxVpValue\u003c/code> are computed\nautomatically from \u003ccode>attributeValues\u003c/code> and \u003ccode>vpType\u003c/code>. Pass \u003ccode>controlPoints\u003c/code> to\noverride the interpolation points (\u003ccode>min\u003c/code>/\u003ccode>max\u003c/code> are derived from the first/last\nentries); pass \u003ccode>ltMinVpValue\u003c/code>/\u003ccode>gtMaxVpValue\u003c/code> to override the values used\nbelow/above the range.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">visualStyleApi.createContinuousMapping(networkId, &#39;NODE_BACKGROUND_COLOR&#39;, {\n  vpType: &#39;color&#39;,\n  attribute: &#39;degree&#39;,\n  attributeValues: [0, 50, 100],\n  attributeType: &#39;long&#39;,\n})\n\u003c/code>\u003c/pre>\n","text":"createContinuousMapping(networkId, vpName, options): ApiResult Creates a continuous (interpolated) mapping. options is a CreateContinuousMappingOptions bundle (see Types ) — the correlated values are passed as one object rather than positionally. options.attributeValues defines the control point values on the data axis. By default, min / max / controlPoints / ltMinVpValue / gtMaxVpValue are computed automatically from attributeValues and vpType . Pass controlPoints to override the interpolation points ( min / max are derived from the first/last entries); pass ltMinVpValue / gtMaxVpValue to override the values used below/above the range. visualStyleApi.createContinuousMapping(networkId, 'NODE_BACKGROUND_COLOR', { vpType: 'color', attribute: 'degree', attributeValues: [0, 50, 100], attributeType: 'long', })","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"MC1","condition":"\u003ccode>vpName\u003c/code> is a network-scoped property"},{"code":"MI1","condition":"\u003ccode>attribute\u003c/code> is not declared in the matching node/edge table"},{"code":"MI2","condition":"\u003ccode>attributeType\u003c/code> does not match the declared column type"},{"code":"MI3","condition":"The source column is non-numeric"},{"code":"V7","condition":"\u003ccode>attributeValues\u003c/code> empty/non-numeric, or a control point is non-numeric"}]},{"name":"createPassthroughMapping","anchor":"visualStyle.createPassthroughMapping","docSignature":"createPassthroughMapping(networkId, vpName, attribute, attributeType): ApiResult","tsSignature":"createPassthroughMapping(networkId: IdType, vpName: VisualPropertyName, attribute: AttributeName, attributeType: ValueTypeName): ApiResult","descriptionHtml":"\u003cp>Creates a passthrough mapping (attribute value used directly as the visual value).\u003c/p>\n","text":"createPassthroughMapping(networkId, vpName, attribute, attributeType): ApiResult Creates a passthrough mapping (attribute value used directly as the visual value).","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"MC1","condition":"\u003ccode>vpName\u003c/code> is a network-scoped property"},{"code":"MI1","condition":"\u003ccode>attribute\u003c/code> is not declared in the matching node/edge table"},{"code":"MI2","condition":"\u003ccode>attributeType\u003c/code> does not match the declared column type"}]},{"name":"deleteMapping","anchor":"visualStyle.deleteMapping","docSignature":"deleteMapping(networkId, vpName): ApiResult","tsSignature":"deleteMapping(networkId: IdType, vpName: VisualPropertyName): ApiResult","descriptionHtml":"\u003cp>Removes any mapping for the specified visual property.\u003c/p>\n\u003cp>All methods in this API return \u003ccode>APP1\u003c/code> if the visual style for \u003ccode>networkId\u003c/code> is not found.\u003c/p>\n\u003chr>\n","text":"deleteMapping(networkId, vpName): ApiResult Removes any mapping for the specified visual property. All methods in this API return APP1 if the visual style for networkId is not found.","errorRefs":[]}]}]},{"name":"LayoutApi","moduleId":"cyweb/LayoutApi","key":"layout","descriptionHtml":"\u003cp>Applies layout algorithms and queries available layouts.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useLayoutApi } from &#39;cyweb/LayoutApi&#39;\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">interface LayoutAlgorithmInfo {\n  engineName: string\n  algorithmName: string\n  displayName: string\n  description: string\n  type: string\n}\n\ninterface ApplyLayoutOptions {\n  algorithmName?: string    // default: LayoutStore.preferredLayout\n  fitAfterLayout?: boolean  // default: true\n}\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Methods","methods":[{"name":"applyLayout","anchor":"layout.applyLayout","docSignature":"applyLayout(networkId, options?): Promise\u003cApiResult>","tsSignature":"applyLayout(networkId: IdType, options?: ApplyLayoutOptions): Promise\u003cApiResult>","descriptionHtml":"\u003cp>Applies a layout algorithm asynchronously. Lifecycle:\u003c/p>\n\u003col>\n\u003cli>Dispatches \u003ccode>layout:started\u003c/code> event\u003c/li>\n\u003cli>Sets \u003ccode>LayoutStore.isRunning = true\u003c/code>\u003c/li>\n\u003cli>Calls \u003ccode>engine.apply(...)\u003c/code> (callback-based, wrapped in a Promise)\u003c/li>\n\u003cli>On completion: updates node positions, records undo, calls \u003ccode>fit()\u003c/code> if requested,\nsets \u003ccode>isRunning = false\u003c/code>, dispatches \u003ccode>layout:completed\u003c/code>\u003c/li>\n\u003c/ol>\n\u003cp>Pre-layout positions are snapshotted for undo.\u003c/p>\n\u003cp>Never throws across the API boundary: if the layout engine throws synchronously\n(or its callback throws), the promise resolves to \u003ccode>fail(APP3)\u003c/code> and\n\u003ccode>LayoutStore.isRunning\u003c/code> is reset to \u003ccode>false\u003c/code> rather than leaving the rejection to\nescape.\u003c/p>\n","text":"applyLayout(networkId, options?): Promise Applies a layout algorithm asynchronously. Lifecycle: Dispatches layout:started event Sets LayoutStore.isRunning = true Calls engine.apply(...) (callback-based, wrapped in a Promise) On completion: updates node positions, records undo, calls fit() if requested, sets isRunning = false , dispatches layout:completed Pre-layout positions are snapshotted for undo. Never throws across the API boundary: if the layout engine throws synchronously (or its callback throws), the promise resolves to fail(APP3) and LayoutStore.isRunning is reset to false rather than leaving the rejection to escape.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> does not exist"},{"code":"APP4","condition":"No engine registered for \u003ccode>algorithmName\u003c/code>"},{"code":"APP3","condition":"The layout engine or its callback threw"}]},{"name":"getAvailableLayouts","anchor":"layout.getAvailableLayouts","docSignature":"getAvailableLayouts(): ApiResult\u003c{ layouts: LayoutAlgorithmInfo[] }>","tsSignature":"getAvailableLayouts(): ApiResult\u003c{ layouts: LayoutAlgorithmInfo[] }>","descriptionHtml":"\u003cp>Returns all registered layout algorithms across all engines. Never fails.\u003c/p>\n\u003chr>\n","text":"getAvailableLayouts(): ApiResult\u003c{ layouts: LayoutAlgorithmInfo[] }> Returns all registered layout algorithms across all engines. Never fails.","errorRefs":[]}]}]},{"name":"ExportApi","moduleId":"cyweb/ExportApi","key":"export","descriptionHtml":"\u003cp>Exports networks to portable formats.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useExportApi } from &#39;cyweb/ExportApi&#39;\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">type Cx2 = any[]   // CX2 format: array of aspect objects\n\ninterface ExportOptions {\n  networkName?: string   // override the network name in the exported CX2\n}\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Methods","methods":[{"name":"exportToCx2","anchor":"export.exportToCx2","docSignature":"exportToCx2(networkId, options?): ApiResult\u003cCx2>","tsSignature":"exportToCx2(networkId: IdType, options?: ExportOptions): ApiResult\u003cCx2>","descriptionHtml":"\u003cp>Assembles the network from NetworkStore, TableStore, VisualStyleStore, ViewModelStore,\nOpaqueAspectStore, and NetworkSummaryStore, then serializes to CX2 format.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Error Code\u003c/th>\n\u003cth>Condition\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>APP1\u003c/code>\u003c/td>\n\u003ctd>Network, tables, visual style, or view model not found — all four checks collapse to this one code (see \u003ca href=\"./ErrorCodes.md\">ErrorCodes.md\u003c/a>)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n","text":"exportToCx2(networkId, options?): ApiResult Assembles the network from NetworkStore, TableStore, VisualStyleStore, ViewModelStore, OpaqueAspectStore, and NetworkSummaryStore, then serializes to CX2 format. Error Code Condition APP1 Network, tables, visual style, or view model not found — all four checks collapse to this one code (see ErrorCodes.md )","errorRefs":[]}]}]},{"name":"WorkspaceApi","moduleId":"cyweb/WorkspaceApi","key":"workspace","descriptionHtml":"\u003cp>Provides read access to workspace state and the ability to switch the active\nnetwork or rename the workspace. All operations are synchronous.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useWorkspaceApi } from &#39;cyweb/WorkspaceApi&#39;\nimport type { WorkspaceInfo, WorkspaceNetworkInfo } from &#39;cyweb/ApiTypes&#39;\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">interface WorkspaceInfo {\n  workspaceId: IdType\n  name: string\n  currentNetworkId: IdType   // &#39;&#39; if no networks are open\n  networkCount: number\n}\n\ninterface WorkspaceNetworkInfo {\n  networkId: IdType\n  name: string\n  description: string\n  nodeCount: number\n  edgeCount: number\n  isModified: boolean   // true when the network has unsaved local changes\n}\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Methods","methods":[{"name":"getWorkspaceInfo","anchor":"workspace.getWorkspaceInfo","docSignature":"getWorkspaceInfo(): ApiResult\u003cWorkspaceInfo>","tsSignature":"getWorkspaceInfo(): ApiResult\u003cWorkspaceInfo>","descriptionHtml":"\u003cp>Returns top-level metadata. Always succeeds.\u003c/p>\n","text":"getWorkspaceInfo(): ApiResult Returns top-level metadata. Always succeeds.","errorRefs":[]},{"name":"getNetworkIds","anchor":"workspace.getNetworkIds","docSignature":"getNetworkIds(): ApiResult\u003c{ networkIds: IdType[] }>","tsSignature":"getNetworkIds(): ApiResult\u003c{ networkIds: IdType[] }>","descriptionHtml":"\u003cp>Returns the ordered list of network IDs (tab order). Always succeeds (empty array\nwhen no networks are open).\u003c/p>\n","text":"getNetworkIds(): ApiResult\u003c{ networkIds: IdType[] }> Returns the ordered list of network IDs (tab order). Always succeeds (empty array when no networks are open).","errorRefs":[]},{"name":"getNetworks","anchor":"workspace.getNetworks","docSignature":"getNetworks(): ApiResult\u003c{ networks: WorkspaceNetworkInfo[] }>","tsSignature":"getNetworks(): ApiResult\u003c{ networks: WorkspaceNetworkInfo[] }>","descriptionHtml":"\u003cp>Returns summary metadata for all networks. Networks whose summary is not found in\nNetworkSummaryStore are \u003cstrong>silently omitted\u003c/strong>.\u003c/p>\n","text":"getNetworks(): ApiResult\u003c{ networks: WorkspaceNetworkInfo[] }> Returns summary metadata for all networks. Networks whose summary is not found in NetworkSummaryStore are silently omitted .","errorRefs":[]},{"name":"getNetworkSummary","anchor":"workspace.getNetworkSummary","docSignature":"getNetworkSummary(networkId): ApiResult\u003cWorkspaceNetworkInfo>","tsSignature":"getNetworkSummary(networkId: IdType): ApiResult\u003cWorkspaceNetworkInfo>","descriptionHtml":"\u003cp>Returns summary metadata for a single network.\u003c/p>\n","text":"getNetworkSummary(networkId): ApiResult Returns summary metadata for a single network.","errorRefs":[{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> is not in the workspace or summary missing"}]},{"name":"getCurrentNetworkId","anchor":"workspace.getCurrentNetworkId","docSignature":"getCurrentNetworkId(): ApiResult\u003c{ networkId: IdType }>","tsSignature":"getCurrentNetworkId(): ApiResult\u003c{ networkId: IdType }>","descriptionHtml":"\u003cp>Returns the currently active network ID.\u003c/p>\n","text":"getCurrentNetworkId(): ApiResult\u003c{ networkId: IdType }> Returns the currently active network ID.","errorRefs":[{"code":"APP2","condition":"No networks are open"}]},{"name":"switchCurrentNetwork","anchor":"workspace.switchCurrentNetwork","docSignature":"switchCurrentNetwork(networkId): ApiResult","tsSignature":"switchCurrentNetwork(networkId: IdType): ApiResult","descriptionHtml":"\u003cp>Switches the active network. Triggers \u003ccode>network:switched\u003c/code> via the Event Bus.\u003c/p>\n","text":"switchCurrentNetwork(networkId): ApiResult Switches the active network. Triggers network:switched via the Event Bus.","errorRefs":[{"code":"APP9","condition":"\u003ccode>networkId\u003c/code> is empty/whitespace"},{"code":"APP1","condition":"\u003ccode>networkId\u003c/code> is not in the workspace"}]},{"name":"setWorkspaceName","anchor":"workspace.setWorkspaceName","docSignature":"setWorkspaceName(name): ApiResult","tsSignature":"setWorkspaceName(name: string): ApiResult","descriptionHtml":"\u003cp>Renames the workspace. The name is trimmed before being stored.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Error Code\u003c/th>\n\u003cth>Condition\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>APP9\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>name\u003c/code> is empty after trimming\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003chr>\n","text":"setWorkspaceName(name): ApiResult Renames the workspace. The name is trimmed before being stored. Error Code Condition APP9 name is empty after trimming","errorRefs":[]}]}]},{"name":"ContextMenuApi","moduleId":null,"key":"contextMenu","descriptionHtml":"\u003cblockquote>\n\u003cp>\u003cstrong>Phase 2 change:\u003c/strong> \u003ccode>cyweb/ContextMenuApi\u003c/code> and \u003ccode>useContextMenuApi()\u003c/code> have been removed.\nContext menu access is now via \u003ccode>AppContext.apis.contextMenu\u003c/code> (per-app factory, lifecycle-managed)\nor \u003ccode>window.CyWebApi.contextMenu\u003c/code> (anonymous singleton, for non-React consumers only).\u003c/p>\n\u003c/blockquote>\n\u003cp>Allows external apps to register and remove custom items in the host&#39;s context\nmenus (right-click on nodes, edges, or the canvas background).\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">// In mount() — per-app factory (recommended for plugin apps)\nmount({ apis }) {\n  apis.contextMenu.addContextMenuItem({ ... })\n}\n\n// In plugin components — via useAppContext()\nimport { useAppContext } from &#39;cyweb/AppIdContext&#39;\nconst ctx = useAppContext()\nctx?.apis.contextMenu.addContextMenuItem({ ... })\n\n// Non-React consumers — anonymous singleton (no auto-cleanup)\nwindow.CyWebApi.contextMenu.addContextMenuItem({ ... })\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">interface ContextMenuTarget {\n  type: &#39;node&#39; | &#39;edge&#39; | &#39;canvas&#39;\n  /** Present for node/edge targets; absent for canvas. */\n  id?: IdType\n  networkId: IdType\n}\n\ninterface ContextMenuItemConfig {\n  /** Display label shown in the menu. Must be non-empty. */\n  label: string\n  /** Called when the user clicks the item. */\n  handler: (target: ContextMenuTarget) =&gt; void\n  /**\n   * Which context menus this item appears in.\n   * @default [&#39;node&#39;, &#39;edge&#39;]\n   */\n  targetTypes?: Array&lt;&#39;node&#39; | &#39;edge&#39; | &#39;canvas&#39;&gt;\n  /** Optional icon URL or data URI rendered next to the label. */\n  icon?: string\n}\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Methods","methods":[{"name":"addContextMenuItem","anchor":"contextMenu.addContextMenuItem","docSignature":"addContextMenuItem(config): ApiResult\u003c{ itemId: string }>","tsSignature":"addContextMenuItem(config: ContextMenuItemConfig): ApiResult\u003c{ itemId: string }>","descriptionHtml":"\u003cp>Registers a new context menu item. Returns a unique \u003ccode>itemId\u003c/code> that can be used to\nremove the item later.\u003c/p>\n\u003cp>Items registered via \u003ccode>AppContext.apis.contextMenu\u003c/code> are automatically cleaned up\nwhen the app is disabled or mount() fails (via \u003ccode>cleanupAllForApp\u003c/code>). Explicit\nremoval in \u003ccode>unmount()\u003c/code> is redundant but harmless.\u003c/p>\n","text":"addContextMenuItem(config): ApiResult\u003c{ itemId: string }> Registers a new context menu item. Returns a unique itemId that can be used to remove the item later. Items registered via AppContext.apis.contextMenu are automatically cleaned up when the app is disabled or mount() fails (via cleanupAllForApp ). Explicit removal in unmount() is redundant but harmless.","errorRefs":[{"code":"APP9","condition":"\u003ccode>label\u003c/code> is empty or whitespace"}]},{"name":"removeContextMenuItem","anchor":"contextMenu.removeContextMenuItem","docSignature":"removeContextMenuItem(itemId): ApiResult","tsSignature":"removeContextMenuItem(itemId: string): ApiResult","descriptionHtml":"\u003cp>Removes a previously registered context menu item.\u003c/p>\n","text":"removeContextMenuItem(itemId): ApiResult Removes a previously registered context menu item.","errorRefs":[{"code":"APP6","condition":"\u003ccode>itemId\u003c/code> is unknown"}]}]},{"title":"Example","intHtml":"\u003cpre>\u003ccode class=\"language-typescript\">// Typical pattern — register in mount(), remove in unmount()\nlet menuItemId: string | undefined\n\nexport const MyApp: CyAppWithLifecycle = {\n  // ...\n  mount(context) {\n    const result = context.apis.contextMenu.addContextMenuItem({\n      label: &#39;Expand Pathway&#39;,\n      handler: (target) =&gt; {\n        if (target.type === &#39;node&#39;) {\n          console.log(&#39;Expand pathway for node:&#39;, target.id)\n        }\n      },\n      targetTypes: [&#39;node&#39;],\n    })\n    if (result.success) {\n      menuItemId = result.data.itemId\n    }\n  },\n\n  // unmount() is optional — context menu items registered via\n  // AppContext.apis.contextMenu are automatically cleaned up when\n  // the app is disabled. Only add unmount() if you have manual\n  // event listeners to remove.\n  unmount() {\n    // No need to remove context menu items — auto-cleaned by host.\n  },\n}\n\u003c/code>\u003c/pre>\n\u003chr>\n","methods":[]}]},{"name":"ResourceApi","moduleId":"cyweb/AppIdContext","key":"resource","descriptionHtml":"\u003cp>Per-app resource registration API for panels and menu items. Available via\n\u003ccode>useAppContext().apis.resource\u003c/code> in plugin components or \u003ccode>context.apis.resource\u003c/code>\nin \u003ccode>mount()\u003c/code>. Not available on \u003ccode>window.CyWebApi\u003c/code>.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useAppContext } from &#39;cyweb/AppIdContext&#39;\n\nfunction MyComponent() {\n  const ctx = useAppContext()\n  if (!ctx) return null\n  const { resource } = ctx.apis\n  // resource.registerPanel(...), resource.getRegisteredResources(), etc.\n}\n\u003c/code>\u003c/pre>\n","groups":[{"title":"Types","typesHtml":"\u003cpre>\u003ccode class=\"language-typescript\">type ResourceSlot = &#39;right-panel&#39; | &#39;apps-menu&#39;\n\ninterface ResourceDeclaration {\n  slot: ResourceSlot\n  id: string\n  title?: string\n  order?: number\n  group?: string\n  requires?: { network?: boolean; selection?: boolean }\n  component: React.ComponentType&lt;any&gt;\n  errorFallback?: React.ComponentType&lt;{ error: Error; resetErrorBoundary: () =&gt; void }&gt;\n  closeOnAction?: boolean   // apps-menu only\n}\n\ninterface RegisteredResourceInfo {\n  resourceId: string   // identity triple: appId::slot::id\n  slot: ResourceSlot\n  id: string\n  title?: string\n  order?: number\n  requires?: { network?: boolean; selection?: boolean }\n}\n\ninterface ResourceVisibilityResult {\n  registered: boolean\n  visible: boolean\n  hiddenReason?: &#39;app-inactive&#39; | &#39;requires-network&#39; | &#39;requires-selection&#39; | &#39;slot-not-rendered&#39;\n}\n\u003c/code>\u003c/pre>\n","methods":[]},{"title":"Methods","methods":[{"name":"getSupportedSlots","anchor":"resource.getSupportedSlots","docSignature":"getSupportedSlots(): ApiResult\u003c{ slots: ResourceSlot[] }>","tsSignature":"getSupportedSlots(): ApiResult\u003c{ slots: ResourceSlot[] }>","descriptionHtml":"\u003cp>Returns the slots the host supports. Currently \u003ccode>[&#39;right-panel&#39;, &#39;apps-menu&#39;]\u003c/code>.\u003c/p>\n","text":"getSupportedSlots(): ApiResult\u003c{ slots: ResourceSlot[] }> Returns the slots the host supports. Currently ['right-panel', 'apps-menu'] .","errorRefs":[]},{"name":"registerPanel","anchor":"resource.registerPanel","docSignature":"registerPanel(options): ApiResult\u003c{ resourceId: string }>","tsSignature":"registerPanel(options: RegisterPanelOptions): ApiResult\u003c{ resourceId: string }>","descriptionHtml":"\u003cp>Registers a panel in the \u003ccode>&#39;right-panel&#39;\u003c/code> slot. Uses upsert semantics: if a\npanel with the same \u003ccode>id\u003c/code> is already registered by this app, it is replaced\nin place (preserving tab selection).\u003c/p>\n","text":"registerPanel(options): ApiResult\u003c{ resourceId: string }> Registers a panel in the 'right-panel' slot. Uses upsert semantics: if a panel with the same id is already registered by this app, it is replaced in place (preserving tab selection).","errorRefs":[{"code":"APP9","condition":"\u003ccode>id\u003c/code> empty, \u003ccode>component\u003c/code> not a valid React type"}]},{"name":"unregisterPanel","anchor":"resource.unregisterPanel","docSignature":"unregisterPanel(panelId): ApiResult","tsSignature":"unregisterPanel(panelId: string): ApiResult","descriptionHtml":"\u003cp>Removes a panel. Returns \u003ccode>APP7\u003c/code> if the panel is not registered.\u003c/p>\n","text":"unregisterPanel(panelId): ApiResult Removes a panel. Returns APP7 if the panel is not registered.","errorRefs":[]},{"name":"registerMenuItem","anchor":"resource.registerMenuItem","docSignature":"registerMenuItem(options): ApiResult\u003c{ resourceId: string }>","tsSignature":"registerMenuItem(options: RegisterMenuItemOptions): ApiResult\u003c{ resourceId: string }>","descriptionHtml":"\u003cp>Registers a menu item in the \u003ccode>&#39;apps-menu&#39;\u003c/code> slot. Uses upsert semantics. Same\nerror codes as \u003ccode>registerPanel\u003c/code>.\u003c/p>\n","text":"registerMenuItem(options): ApiResult\u003c{ resourceId: string }> Registers a menu item in the 'apps-menu' slot. Uses upsert semantics. Same error codes as registerPanel .","errorRefs":[]},{"name":"unregisterMenuItem","anchor":"resource.unregisterMenuItem","docSignature":"unregisterMenuItem(menuItemId): ApiResult","tsSignature":"unregisterMenuItem(menuItemId: string): ApiResult","descriptionHtml":"\u003cp>Removes a menu item. Returns \u003ccode>APP7\u003c/code> if the menu item is not registered.\u003c/p>\n","text":"unregisterMenuItem(menuItemId): ApiResult Removes a menu item. Returns APP7 if the menu item is not registered.","errorRefs":[]},{"name":"unregisterAll","anchor":"resource.unregisterAll","docSignature":"unregisterAll(): ApiResult","tsSignature":"unregisterAll(): ApiResult","descriptionHtml":"\u003cp>Removes all resources registered by this app.\u003c/p>\n","text":"unregisterAll(): ApiResult Removes all resources registered by this app.","errorRefs":[]},{"name":"registerAll","anchor":"resource.registerAll","docSignature":"registerAll(entries): ApiResult\u003c{ registered, errors }>","tsSignature":"registerAll(entries: RegisterResourceEntry[]): ApiResult\u003c{ registered: Array\u003c{ resourceId: string }> errors: Array\u003c{ id: string; slot: ResourceSlot; error: ApiError }> }>","descriptionHtml":"\u003cp>Batch registration. Always returns \u003ccode>ok()\u003c/code>. Check \u003ccode>result.data.errors\u003c/code> for\npartial failures.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">const result = apis.resource.registerAll([\n  { slot: &#39;right-panel&#39;, id: &#39;Panel&#39;, component: MyPanel },\n  { slot: &#39;apps-menu&#39;, id: &#39;Menu&#39;, component: MyMenu },\n])\nif (result.success &amp;&amp; result.data.errors.length &gt; 0) {\n  console.warn(&#39;Partial failures:&#39;, result.data.errors)\n}\n\u003c/code>\u003c/pre>\n","text":"registerAll(entries): ApiResult\u003c{ registered, errors }> Batch registration. Always returns ok() . Check result.data.errors for partial failures. const result = apis.resource.registerAll([ { slot: 'right-panel', id: 'Panel', component: MyPanel }, { slot: 'apps-menu', id: 'Menu', component: MyMenu }, ]) if (result.success && result.data.errors.length > 0) { console.warn('Partial failures:', result.data.errors) }","errorRefs":[]},{"name":"getRegisteredResources","anchor":"resource.getRegisteredResources","docSignature":"getRegisteredResources(): ApiResult\u003c{ resources: RegisteredResourceInfo[] }>","tsSignature":"getRegisteredResources(): ApiResult\u003c{ resources: RegisteredResourceInfo[] }>","descriptionHtml":"\u003cp>Returns all resources registered by this app. Useful for debugging.\u003c/p>\n","text":"getRegisteredResources(): ApiResult\u003c{ resources: RegisteredResourceInfo[] }> Returns all resources registered by this app. Useful for debugging.","errorRefs":[]},{"name":"getResourceVisibility","anchor":"resource.getResourceVisibility","docSignature":"getResourceVisibility(id): ApiResult\u003cResourceVisibilityResult>","tsSignature":"getResourceVisibility(id: string): ApiResult\u003cResourceVisibilityResult>","descriptionHtml":"\u003cp>Returns the visibility evaluation for a specific resource. Evaluates:\u003c/p>\n\u003col>\n\u003cli>App active status\u003c/li>\n\u003cli>\u003ccode>requires.network\u003c/code> — hidden when no network is loaded\u003c/li>\n\u003cli>\u003ccode>requires.selection\u003c/code> — hidden when nothing is selected, evaluated against the\ncurrent network&#39;s live selection\u003c/li>\n\u003c/ol>\n\u003chr>\n","text":"getResourceVisibility(id): ApiResult Returns the visibility evaluation for a specific resource. Evaluates: App active status requires.network — hidden when no network is loaded requires.selection
