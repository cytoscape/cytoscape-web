— hidden when nothing is selected, evaluated against the current network's live selection","errorRefs":[]}]}]}],"guides":[{"title":"Overview","anchor":"overview","html":"\u003cp>The app API (\u003ccode>src/app-api/\u003c/code>) is the sole public API for external apps loaded via\nModule Federation. It provides a stable contract independent of internal store and\nhook implementations.\u003c/p>\n\u003cp>The API is organized into \u003cstrong>10 domain namespaces\u003c/strong> (Phase 1a–1f), a \u003cstrong>Context Menu\nAPI\u003c/strong> (per-app factory), a \u003cstrong>Resource Registration API\u003c/strong> (Phase 2), an \u003cstrong>Event Bus\u003c/strong>\n(useCyWebEvent), and an \u003cstrong>App Lifecycle\u003c/strong> interface with declarative resource support.\u003c/p>\n","text":"The app API ( src/app-api/ ) is the sole public API for external apps loaded via Module Federation. It provides a stable contract independent of internal store and hook implementations. The API is organized into 10 domain namespaces (Phase 1a–1f), a Context Menu API (per-app factory), a Resource Registration API (Phase 2), an Event Bus (useCyWebEvent), and an App Lifecycle interface with declarative resource support."},{"title":"Result Convention","anchor":"result-convention","html":"\u003cp>All app API operations return \u003ccode>ApiResult&lt;T&gt;\u003c/code>, a discriminated union:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>{ success: true, data: T }\u003c/code> — operation succeeded\u003c/li>\n\u003cli>\u003ccode>{ success: false, error: { code, severity, message } }\u003c/code> — operation failed\u003c/li>\n\u003c/ul>\n\u003cp>App API hooks \u003cstrong>never\u003c/strong> throw exceptions across the API boundary.\u003c/p>\n","text":"All app API operations return ApiResult\u003cT> , a discriminated union: { success: true, data: T } — operation succeeded { success: false, error: { code, severity, message } } — operation failed App API hooks never throw exceptions across the API boundary."},{"title":"Error Codes","anchor":"error-codes","html":"\u003cp>Every failure carries a \u003ccode>code\u003c/code>, a \u003ccode>severity\u003c/code> (\u003ccode>&#39;error&#39;\u003c/code> or \u003ccode>&#39;warning&#39;\u003c/code> — see the\n\u003ca href=\"./ErrorCodes.md#mi1\">MI1/MI2/MI3 caveat\u003c/a> for what \u003ccode>severity\u003c/code> means when a code is\nalways blocking regardless), and a \u003ccode>message\u003c/code>. Codes that enforce a CX2 validation\nrequirement reuse the CX2 code string directly (\u003ccode>FK1\u003c/code>, \u003ccode>BV1\u003c/code>, \u003ccode>MI3\u003c/code>, …); concepts\nwith no CX2 equivalent (workspace/registry/runtime state) use a distinct \u003ccode>APP*\u003c/code>\nnamespace that can never collide with a future CX2 code addition.\u003c/p>\n\u003cp>See \u003cstrong>\u003ca href=\"./ErrorCodes.md\">ErrorCodes.md\u003c/a>\u003c/strong> for the full catalog — one entry per code,\nwith severity, message, which methods return it, and (for CX2-derived codes) the\ncorresponding CX2 spec provenance.\u003c/p>\n","text":"Every failure carries a code , a severity ( 'error' or 'warning' — see the MI1/MI2/MI3 caveat for what severity means when a code is always blocking regardless), and a message . Codes that enforce a CX2 validation requirement reuse the CX2 code string directly ( FK1 , BV1 , MI3 , …); concepts with no CX2 equivalent (workspace/registry/runtime state) use a distinct APP* namespace that can never collide with a future CX2 code addition. See ErrorCodes.md for the full catalog — one entry per code, with severity, message, which methods return it, and (for CX2-derived codes) the corresponding CX2 spec provenance."},{"title":"Module Federation Entry","anchor":"module-federation-entry","html":"\u003cp>External apps import types from \u003ccode>cyweb/ApiTypes\u003c/code>:\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import type { ApiResult, IdType } from &#39;cyweb/ApiTypes&#39;\nimport { AppCodes, ElementCodes, ok, fail, isOk, isFail } from &#39;cyweb/ApiTypes&#39;\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>ok()\u003c/code> / \u003ccode>fail()\u003c/code> construct results; \u003ccode>isOk(result)\u003c/code> / \u003ccode>isFail(result)\u003c/code> are type\nguards that narrow an \u003ccode>ApiResult&lt;T&gt;\u003c/code> to its success or failure branch (handy in\n\u003ccode>filter\u003c/code>/\u003ccode>map\u003c/code> chains where \u003ccode>result.success\u003c/code> narrowing is inconvenient).\u003c/p>\n","text":"External apps import types from cyweb/ApiTypes : import type { ApiResult, IdType } from 'cyweb/ApiTypes' import { AppCodes, ElementCodes, ok, fail, isOk, isFail } from 'cyweb/ApiTypes' ok() / fail() construct results; isOk(result) / isFail(result) are type guards that narrow an ApiResult\u003cT> to its success or failure branch (handy in filter / map chains where result.success narrowing is inconvenient)."},{"title":"App API Hooks","anchor":"app-api-hooks","html":"\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Module\u003c/th>\n\u003cth>Hook\u003c/th>\n\u003cth>Key on \u003ccode>window.CyWebApi\u003c/code>\u003c/th>\n\u003cth>Phase\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>cyweb/ElementApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useElementApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.element\u003c/code>\u003c/td>\n\u003ctd>1a\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/NetworkApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useNetworkApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.network\u003c/code>\u003c/td>\n\u003ctd>1b\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/SelectionApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useSelectionApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.selection\u003c/code>\u003c/td>\n\u003ctd>1c\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/ViewportApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useViewportApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.viewport\u003c/code>\u003c/td>\n\u003ctd>1c\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/TableApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useTableApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.table\u003c/code>\u003c/td>\n\u003ctd>1d\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/VisualStyleApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useVisualStyleApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.visualStyle\u003c/code>\u003c/td>\n\u003ctd>1d\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/LayoutApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useLayoutApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.layout\u003c/code>\u003c/td>\n\u003ctd>1e\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/ExportApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useExportApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.export\u003c/code>\u003c/td>\n\u003ctd>1e\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/WorkspaceApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useWorkspaceApi()\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.workspace\u003c/code>\u003c/td>\n\u003ctd>1f\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/ScopedApi\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useScopedApi(id?)\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>.forNetwork(id?)\u003c/code>\u003c/td>\n\u003ctd>1g\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>cyweb/EventBus\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>useCyWebEvent()\u003c/code>\u003c/td>\n\u003ctd>\u003cem>(window events)\u003c/em>\u003c/td>\n\u003ctd>1g\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>All hooks are thin React wrappers around framework-agnostic core objects.\nThe same objects are exposed on \u003ccode>window.CyWebApi\u003c/code> for Vanilla JS consumers.\u003c/p>\n\u003ch3 id=\"scoped-current-network-api--cywebapifornetworknetworkid\">Scoped (current-network) API — \u003ccode>CyWebApi.forNetwork(networkId?)\u003c/code>\u003c/h3>\n\u003cp>Every method on the network-scoped domains takes \u003ccode>networkId\u003c/code> as its first\nargument. \u003ccode>forNetwork(networkId?)\u003c/code> returns a view of those domains — \u003ccode>element\u003c/code>,\n\u003ccode>table\u003c/code>, \u003ccode>selection\u003c/code>, \u003ccode>viewport\u003c/code>, \u003ccode>visualStyle\u003c/code>, \u003ccode>export\u003c/code>, and \u003ccode>layout\u003c/code>\n(\u003ccode>applyLayout\u003c/code> only) — with the id pre-bound, so it never has to be passed on\nindividual calls. Omit the argument to target the workspace&#39;s \u003cstrong>current\u003c/strong>\nnetwork, resolved at call time.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">// Bind the current network (resolved per call)\nconst net = window.CyWebApi.forNetwork()\nnet.element.createNode([100, 200])\nnet.selection.exclusiveSelect([&#39;n1&#39;], [])\nnet.table.getTable(&#39;node&#39;)\n\n// Bind a specific network\nconst other = window.CyWebApi.forNetwork(&#39;net-42&#39;)\nother.export.exportToCx2()\n\u003c/code>\u003c/pre>\n\u003cp>React apps get the same view from the \u003ccode>cyweb/ScopedApi\u003c/code> hook, memoized per\nnetworkId (stable across renders, safe in effect/callback deps):\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useScopedApi } from &#39;cyweb/ScopedApi&#39;\n\nconst net = useScopedApi()        // current network\nconst other = useScopedApi(id)    // a specific network\n\u003c/code>\u003c/pre>\n\u003cp>Domains whose methods are not uniformly network-scoped — \u003ccode>network\u003c/code>, \u003ccode>workspace\u003c/code>,\n\u003ccode>contextMenu\u003c/code> — are excluded from the scoped view; call those on the top-level\n\u003ccode>CyWebApi\u003c/code>. \u003ccode>layout\u003c/code> appears in the scoped view with only its network-scoped\n\u003ccode>applyLayout\u003c/code> bound (read algorithms from \u003ccode>CyWebApi.layout.getAvailableLayouts()\u003c/code>).\nThe scoped view is purely additive: it delegates to the same underlying domain\nobjects.\u003c/p>\n\u003ch3 id=\"readiness--cywebapiwhenready--cywebapiisready\">Readiness — \u003ccode>CyWebApi.whenReady()\u003c/code> / \u003ccode>CyWebApi.isReady()\u003c/code>\u003c/h3>\n\u003cp>\u003ccode>window.CyWebApi\u003c/code> is assigned before the app finishes hydrating, so its\nstateful methods only work after startup completes. Rather than listen for the\none-shot \u003ccode>cywebapi:ready\u003c/code> event and track whether it already fired, await the\npromise:\u003c/p>\n\u003cpre>\u003ccode class=\"language-javascript\">const api = await window.CyWebApi.whenReady() // resolves immediately if ready\napi.forNetwork().element.createNode([0, 0])\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>whenReady()\u003c/code> resolves with the \u003ccode>CyWebApi\u003c/code> object; \u003ccode>isReady()\u003c/code> returns the\ncurrent boolean. The \u003ccode>cywebapi:ready\u003c/code> window event still fires for consumers\nthat prefer events.\u003c/p>\n\u003cblockquote>\n\u003cp>\u003cstrong>Context Menu API:\u003c/strong> \u003ccode>cyweb/ContextMenuApi\u003c/code> and \u003ccode>useContextMenuApi()\u003c/code> were removed in Phase 2.\nContext menu access is now via \u003ccode>AppContext.apis.contextMenu\u003c/code> (per-app factory in \u003ccode>mount()\u003c/code>) or\n\u003ccode>window.CyWebApi.contextMenu\u003c/code> (anonymous singleton for non-React consumers).\nSee \u003ccode>createContextMenuApi(appId)\u003c/code> in \u003ccode>src/app-api/core/contextMenuApi.ts\u003c/code>.\u003c/p>\n\u003c/blockquote>\n\u003chr>\n","text":"Module Hook Key on window.CyWebApi Phase cyweb/ElementApi useElementApi() .element 1a cyweb/NetworkApi useNetworkApi() .network 1b cyweb/SelectionApi useSelectionApi() .selection 1c cyweb/ViewportApi useViewportApi() .viewport 1c cyweb/TableApi useTableApi() .table 1d cyweb/VisualStyleApi useVisualStyleApi() .visualStyle 1d cyweb/LayoutApi useLayoutApi() .layout 1e cyweb/ExportApi useExportApi() .export 1e cyweb/WorkspaceApi useWorkspaceApi() .workspace 1f cyweb/ScopedApi useScopedApi(id?) .forNetwork(id?) 1g cyweb/EventBus useCyWebEvent() (window events) 1g All hooks are thin React wrappers around framework-agnostic core objects. The same objects are exposed on window.CyWebApi for Vanilla JS consumers. Scoped (current-network) API — CyWebApi.forNetwork(networkId?) Every method on the network-scoped domains takes networkId as its first argument. forNetwork(networkId?) returns a view of those domains — element , table , selection , viewport , visualStyle , export , and layout ( applyLayout only) — with the id pre-bound, so it never has to be passed on individual calls. Omit the argument to target the workspace's current network, resolved at call time. // Bind the current network (resolved per call) const net = window.CyWebApi.forNetwork() net.element.createNode([100, 200]) net.selection.exclusiveSelect(['n1'], []) net.table.getTable('node') // Bind a specific network const other = window.CyWebApi.forNetwork('net-42') other.export.exportToCx2() React apps get the same view from the cyweb/ScopedApi hook, memoized per networkId (stable across renders, safe in effect/callback deps): import { useScopedApi } from 'cyweb/ScopedApi' const net = useScopedApi() // current network const other = useScopedApi(id) // a specific network Domains whose methods are not uniformly network-scoped — network , workspace , contextMenu — are excluded from the scoped view; call those on the top-level CyWebApi . layout appears in the scoped view with only its network-scoped applyLayout bound (read algorithms from CyWebApi.layout.getAvailableLayouts() ). The scoped view is purely additive: it delegates to the same underlying domain objects. Readiness — CyWebApi.whenReady() / CyWebApi.isReady() window.CyWebApi is assigned before the app finishes hydrating, so its stateful methods only work after startup completes. Rather than listen for the one-shot cywebapi:ready event and track whether it already fired, await the promise: const api = await window.CyWebApi.whenReady() // resolves immediately if ready api.forNetwork().element.createNode([0, 0]) whenReady() resolves with the CyWebApi object; isReady() returns the current boolean. The cywebapi:ready window event still fires for consumers that prefer events. Context Menu API: cyweb/ContextMenuApi and useContextMenuApi() were removed in Phase 2. Context menu access is now via AppContext.apis.contextMenu (per-app factory in mount() ) or window.CyWebApi.contextMenu (anonymous singleton for non-React consumers). See createContextMenuApi(appId) in src/app-api/core/contextMenuApi.ts ."},{"title":"Event Bus (`cyweb/EventBus`)","anchor":"event-bus-cyweb-eventbus","html":"\u003cp>The Event Bus bridges Cytoscape Web&#39;s internal Zustand store mutations to typed\n\u003ccode>CustomEvent\u003c/code>s dispatched on \u003ccode>window\u003c/code>. External apps subscribe to these events\nto react to state changes in real time.\u003c/p>\n\u003ch3 id=\"architecture\">Architecture\u003c/h3>\n\u003cpre>\u003ccode>Zustand stores → initEventBus (subscriptions) → dispatchCyWebEvent → window CustomEvent\nlayoutApi.ts ──────────────────────────────────→ dispatchCyWebEvent → window CustomEvent\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>initEventBus()\u003c/code> is called once after store hydration in \u003ccode>src/features/AppShell.tsx\u003c/code>. It wires\nstore subscriptions for all events except \u003ccode>layout:started\u003c/code>/\u003ccode>layout:completed\u003c/code>,\nwhich are dispatched directly from \u003ccode>layoutApi.ts\u003c/code>.\u003c/p>\n\u003ch3 id=\"subscribing-react\">Subscribing (React)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useCyWebEvent } from &#39;cyweb/EventBus&#39;\nimport { useCallback } from &#39;react&#39;\n\nfunction MyComponent() {\n  const handleSwitch = useCallback(({ networkId, previousId }) =&gt; {\n    console.log(&#39;switched to&#39;, networkId, &#39;from&#39;, previousId)\n  }, [])\n\n  useCyWebEvent(&#39;network:switched&#39;, handleSwitch)\n}\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>useCyWebEvent(eventType, handler)\u003c/code> subscribes on mount and automatically removes\nthe listener on unmount. The \u003ccode>handler\u003c/code> receives the typed \u003ccode>detail\u003c/code> object directly\n(not the raw \u003ccode>CustomEvent\u003c/code>).\u003c/p>\n\u003cp>\u003cstrong>Stability requirement:\u003c/strong> Wrap \u003ccode>handler\u003c/code> in \u003ccode>useCallback\u003c/code> (or a stable reference)\nto avoid re-subscribing on every render.\u003c/p>\n\u003ch3 id=\"subscribing-vanilla-js\">Subscribing (Vanilla JS)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-javascript\">window.addEventListener(&#39;cywebapi:ready&#39;, () =&gt; {\n  window.addEventListener(&#39;network:switched&#39;, (e) =&gt; {\n    console.log(&#39;switched to&#39;, e.detail.networkId)\n  })\n})\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"event-reference\">Event Reference\u003c/h3>\n\u003ch4 id=\"networkcreated\">\u003ccode>network:created\u003c/code>\u003c/h4>\n\u003cp>Fired when a new network is added to the workspace.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: { networkId: IdType }\n\u003c/code>\u003c/pre>\n\u003cp>Source: WorkspaceStore subscription (\u003ccode>workspace.networkIds\u003c/code>).\u003c/p>\n\u003ch4 id=\"networkdeleted\">\u003ccode>network:deleted\u003c/code>\u003c/h4>\n\u003cp>Fired when a network is removed from the workspace.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: { networkId: IdType }\n\u003c/code>\u003c/pre>\n\u003cp>Source: WorkspaceStore subscription (\u003ccode>workspace.networkIds\u003c/code>).\u003c/p>\n\u003ch4 id=\"networkswitched\">\u003ccode>network:switched\u003c/code>\u003c/h4>\n\u003cp>Fired when the active (current) network changes.\n\u003ccode>previousId\u003c/code> is an empty string if no network was active before.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: { networkId: IdType; previousId: IdType }\n\u003c/code>\u003c/pre>\n\u003cp>Source: WorkspaceStore subscription (\u003ccode>workspace.currentNetworkId\u003c/code>).\nAlso triggered by \u003ccode>WorkspaceApi.switchCurrentNetwork\u003c/code>.\u003c/p>\n\u003ch4 id=\"selectionchanged\">\u003ccode>selection:changed\u003c/code>\u003c/h4>\n\u003cp>Fired when the selection state of the current network&#39;s primary view changes.\nUses value-equality comparison to suppress spurious events (e.g., re-clicking\nthe same node produces identical arrays).\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: {\n  networkId: IdType\n  selectedNodes: IdType[]\n  selectedEdges: IdType[]\n}\n\u003c/code>\u003c/pre>\n\u003cp>Source: ViewModelStore subscription (current network&#39;s view \u003ccode>selectedNodes\u003c/code> / \u003ccode>selectedEdges\u003c/code>).\nAlso triggered by SelectionApi write methods.\u003c/p>\n\u003ch4 id=\"layoutstarted\">\u003ccode>layout:started\u003c/code>\u003c/h4>\n\u003cp>Fired immediately before a layout algorithm begins executing.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: { networkId: IdType; algorithm: string }\n\u003c/code>\u003c/pre>\n\u003cp>Source: \u003ccode>layoutApi.applyLayout\u003c/code> (dispatched directly, not via store subscription).\u003c/p>\n\u003ch4 id=\"layoutcompleted\">\u003ccode>layout:completed\u003c/code>\u003c/h4>\n\u003cp>Fired when a layout algorithm finishes and node positions are updated.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: { networkId: IdType; algorithm: string }\n\u003c/code>\u003c/pre>\n\u003cp>Source: \u003ccode>layoutApi.applyLayout\u003c/code> (dispatched directly, not via store subscription).\u003c/p>\n\u003ch4 id=\"stylechanged\">\u003ccode>style:changed\u003c/code>\u003c/h4>\n\u003cp>Fired when a visual style property changes on any network.\n\u003ccode>property\u003c/code> is a \u003ccode>VisualPropertyName\u003c/code> string (e.g., \u003ccode>&#39;NODE_BACKGROUND_COLOR&#39;\u003c/code>).\nOne event is fired per changed property per network per store update.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: { networkId: IdType; property: string }\n\u003c/code>\u003c/pre>\n\u003cp>Source: VisualStyleStore subscription (full-state diff, no \u003ccode>subscribeWithSelector\u003c/code>).\u003c/p>\n\u003ch4 id=\"datachanged\">\u003ccode>data:changed\u003c/code>\u003c/h4>\n\u003cp>Fired when table data is written to a network&#39;s node or edge table.\n\u003ccode>rowIds\u003c/code> lists the node/edge IDs whose data changed. An empty array indicates\na schema-only change (e.g., column created or deleted).\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">detail: {\n  networkId: IdType\n  tableType: &#39;node&#39; | &#39;edge&#39;\n  rowIds: IdType[]\n}\n\u003c/code>\u003c/pre>\n\u003cp>Source: TableStore subscription (\u003ccode>tables\u003c/code> selector).\nAlso triggered by TableApi write methods.\u003c/p>\n\u003ch3 id=\"event-dispatch-table\">Event Dispatch Table\u003c/h3>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>API Method / Store Mutation\u003c/th>\n\u003cth>Events Fired\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>networkApi.createNetworkFromEdgeList\u003c/code> (addToWorkspace: true)\u003c/td>\n\u003ctd>\u003ccode>network:created\u003c/code>, \u003ccode>network:switched\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>networkApi.createNetworkFromCx2\u003c/code> (addToWorkspace: true)\u003c/td>\n\u003ctd>\u003ccode>network:created\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>networkApi.createNetworkFromCx2\u003c/code> (navigate: true)\u003c/td>\n\u003ctd>\u003ccode>network:switched\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>networkApi.deleteNetwork\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>network:deleted\u003c/code>, \u003ccode>network:switched\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>networkApi.deleteAllNetworks\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>network:deleted\u003c/code> (×N)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>workspaceApi.switchCurrentNetwork\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>network:switched\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>selectionApi.exclusiveSelect\u003c/code> / \u003ccode>additiveSelect\u003c/code> / \u003ccode>additiveDeselect\u003c/code> / \u003ccode>toggleSelected\u003c/code> / \u003ccode>clearSelection\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>selection:changed\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>layoutApi.applyLayout\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>layout:started\u003c/code>, \u003ccode>layout:completed\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>visualStyleApi.setDefault\u003c/code> / \u003ccode>setBypass\u003c/code> / \u003ccode>deleteBypass\u003c/code> / \u003ccode>create*Mapping\u003c/code> / \u003ccode>deleteMapping\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>style:changed\u003c/code> (×per property)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>tableApi.setValue\u003c/code> / \u003ccode>setValues\u003c/code> / \u003ccode>editRows\u003c/code> / \u003ccode>createColumn\u003c/code> / \u003ccode>deleteColumn\u003c/code> / \u003ccode>renameColumn\u003c/code> / \u003ccode>applyValueToElements\u003c/code>\u003c/td>\n\u003ctd>\u003ccode>data:changed\u003c/code>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>contextMenuApi.addContextMenuItem\u003c/code> / \u003ccode>removeContextMenuItem\u003c/code>\u003c/td>\n\u003ctd>\u003cem>(no events — synchronous store mutation only)\u003c/em>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch3 id=\"usage-example-react\">Usage Example (React)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-typescript\">import { useWorkspaceApi } from &#39;cyweb/WorkspaceApi&#39;\nimport { useCyWebEvent } from &#39;cyweb/EventBus&#39;\nimport { useState, useEffect, useCallback } from &#39;react&#39;\nimport type { WorkspaceNetworkInfo } from &#39;cyweb/ApiTypes&#39;\n\nfunction NetworkList() {\n  const workspaceApi = useWorkspaceApi()\n  const [networks, setNetworks] = useState&lt;WorkspaceNetworkInfo[]&gt;([])\n\n  const refresh = useCallback(() =&gt; {\n    const result = workspaceApi.getNetworks()\n    if (result.success) setNetworks(result.data.networks)\n  }, [workspaceApi])\n\n  useEffect(refresh, [refresh])\n\n  useCyWebEvent(&#39;network:created&#39;, refresh)\n  useCyWebEvent(&#39;network:deleted&#39;, refresh)\n\n  const handleSwitch = (networkId: string) =&gt; {\n    workspaceApi.switchCurrentNetwork(networkId)\n  }\n\n  return (\n    &lt;ul&gt;\n      {networks.map((n) =&gt; (\n        &lt;li key={n.networkId} onClick={() =&gt; handleSwitch(n.networkId)}&gt;\n          {n.name} ({n.nodeCount} nodes){n.isModified ? &#39; *&#39; : &#39;&#39;}\n        &lt;/li&gt;\n      ))}\n    &lt;/ul&gt;\n  )\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"usage-example-vanilla-js\">Usage Example (Vanilla JS)\u003c/h3>\n\u003cpre>\u003ccode class=\"language-javascript\">window.addEventListener(&#39;cywebapi:ready&#39;, () =&gt; {\n  const { workspace, network } = window.CyWebApi\n\n  // Display workspace name\n  const info = workspace.getWorkspaceInfo()\n  if (info.success) document.title = info.data.name\n\n  // React to events\n  window.addEventListener(&#39;selection:changed&#39;, (e) =&gt; {\n    const { selectedNodes, selectedEdges } = e.detail\n    console.log(`Selected: ${selectedNodes.length} nodes, ${selectedEdges.length} edges`)\n  })\n\n  window.addEventListener(&#39;data:changed&#39;, (e) =&gt; {\n    const { networkId, tableType, rowIds } = e.detail\n    if (rowIds.length === 0) {\n      console.log(`Schema changed in ${tableType} table of ${networkId}`)\n    } else {\n      console.log(`${rowIds.length} ${tableType} rows changed in ${networkId}`)\n    }\n  })\n})\n\u003c/code>\u003c/pre>\n\u003chr>\n","text":"The Event Bus bridges Cytoscape Web's internal Zustand store mutations to typed CustomEvent s dispatched on window . External apps subscribe to these events to react to state changes in real time. Architecture Zustand stores → initEventBus (subscriptions) → dispatchCyWebEvent → window CustomEvent layoutApi.ts ──────────────────────────────────→ dispatchCyWebEvent → window CustomEvent initEventBus() is called once after store hydration in src/features/AppShell.tsx . It wires store subscriptions for all events except layout:started / layout:completed , which are dispatched directly from layoutApi.ts . Subscribing (React) import { useCyWebEvent } from 'cyweb/EventBus' import { useCallback } from 'react' function MyComponent() { const handleSwitch = useCallback(({ networkId, previousId }) => { console.log('switched to', networkId, 'from', previousId) }, []) useCyWebEvent('network:switched', handleSwitch) } useCyWebEvent(eventType, handler) subscribes on mount and automatically removes the listener on unmount. The handler receives the typed detail object directly (not the raw CustomEvent ). Stability requirement: Wrap handler in useCallback (or a stable reference) to avoid re-subscribing on every render. Subscribing (Vanilla JS) window.addEventListener('cywebapi:ready', () => { window.addEventListener('network:switched', (e) => { console.log('switched to', e.detail.networkId) }) }) Event Reference network:created Fired when a new network is added to the workspace. detail: { networkId: IdType } Source: WorkspaceStore subscription ( workspace.networkIds ). network:deleted Fired when a network is removed from the workspace. detail: { networkId: IdType } Source: WorkspaceStore subscription ( workspace.networkIds ). network:switched Fired when the active (current) network changes. previousId is an empty string if no network was active before. detail: { networkId: IdType; previousId: IdType } Source: WorkspaceStore subscription ( workspace.currentNetworkId ). Also triggered by WorkspaceApi.switchCurrentNetwork . selection:changed Fired when the selection state of the current network's primary view changes. Uses value-equality comparison to suppress spurious events (e.g., re-clicking the same node produces identical arrays). detail: { networkId: IdType selectedNodes: IdType[] selectedEdges: IdType[] } Source: ViewModelStore subscription (current network's view selectedNodes / selectedEdges ). Also triggered by SelectionApi write methods. layout:started Fired immediately before a layout algorithm begins executing. detail: { networkId: IdType; algorithm: string } Source: layoutApi.applyLayout (dispatched directly, not via store subscription). layout:completed Fired when a layout algorithm finishes and node positions are updated. detail: { networkId: IdType; algorithm: string } Source: layoutApi.applyLayout (dispatched directly, not via store subscription). style:changed Fired when a visual style property changes on any network. property is a VisualPropertyName string (e.g., 'NODE_BACKGROUND_COLOR' ). One event is fired per changed property per network per store update. detail: { networkId: IdType; property: string } Source: VisualStyleStore subscription (full-state diff, no subscribeWithSelector ). data:changed Fired when table data is written to a network's node or edge table. rowIds lists the node/edge IDs whose data changed. An empty array indicates a schema-only change (e.g., column created or deleted). detail: { networkId: IdType tableType: 'node' | 'edge' rowIds: IdType[] } Source: TableStore subscription ( tables selector). Also triggered by TableApi write methods. Event Dispatch Table API Method / Store Mutation Events Fired networkApi.createNetworkFromEdgeList (addToWorkspace: true) network:created , network:switched networkApi.createNetworkFromCx2 (addToWorkspace: true) network:created networkApi.createNetworkFromCx2 (navigate: true) network:switched networkApi.deleteNetwork network:deleted , network:switched networkApi.deleteAllNetworks network:deleted (×N) workspaceApi.switchCurrentNetwork network:switched selectionApi.exclusiveSelect / additiveSelect / additiveDeselect / toggleSelected / clearSelection selection:changed layoutApi.applyLayout layout:started , layout:completed visualStyleApi.setDefault / setBypass / deleteBypass / create*Mapping / deleteMapping style:changed (×per property) tableApi.setValue / setValues / editRows / createColumn / deleteColumn / renameColumn / applyValueToElements data:changed contextMenuApi.addContextMenuItem / removeContextMenuItem (no events — synchronous store mutation only) Usage Example (React) import { useWorkspaceApi } from 'cyweb/WorkspaceApi' import { useCyWebEvent } from 'cyweb/EventBus' import { useState, useEffect, useCallback } from 'react' import type { WorkspaceNetworkInfo } from 'cyweb/ApiTypes' function NetworkList() { const workspaceApi = useWorkspaceApi() const [networks, setNetworks] = useState\u003cWorkspaceNetworkInfo[]>([]) const refresh = useCallback(() => { const result = workspaceApi.getNetworks() if (result.success) setNetworks(result.data.networks) }, [workspaceApi]) useEffect(refresh, [refresh]) useCyWebEvent('network:created', refresh) useCyWebEvent('network:deleted', refresh) const handleSwitch = (networkId: string) => { workspaceApi.switchCurrentNetwork(networkId) } return ( \u003cul> {networks.map((n) => ( \u003cli key={n.networkId} onClick={() => handleSwitch(n.networkId)}> {n.name} ({n.nodeCount} nodes){n.isModified ? ' *' : ''} \u003c/li> ))} \u003c/ul> ) } Usage Example (Vanilla JS) window.addEventListener('cywebapi:ready', () => { const { workspace, network } = window.CyWebApi // Display workspace name const info = workspace.getWorkspaceInfo() if (info.success) document.title = info.data.name // React to events window.addEventListener('selection:changed', (e) => { const { selectedNodes, selectedEdges } = e.detail console.log(`Selected: ${selectedNodes.length} nodes, ${selectedEdges.length} edges`) }) window.addEventListener('data:changed', (e) => { const { networkId, tableType, rowIds } = e.detail if (rowIds.length === 0) { console.log(`Schema changed in ${tableType} table of ${networkId}`) } else { console.log(`${rowIds.length} ${tableType} rows changed in ${networkId}`) } }) })"},{"title":"App Lifecycle","anchor":"app-lifecycle","html":"\u003ch3 id=\"appcontext\">\u003ccode>AppContext\u003c/code>\u003c/h3>\n\u003cp>Passed to \u003ccode>mount()\u003c/code> when the app is activated:\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">interface AppContext {\n  readonly appId: string          // unique ID of this app instance\n  readonly apis: AppContextApis   // per-app APIs (extends CyWebApiType)\n}\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"appcontextapis\">\u003ccode>AppContextApis\u003c/code>\u003c/h3>\n\u003cp>Per-app API object that extends \u003ccode>CyWebApiType\u003c/code> with additional per-app capabilities:\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">interface AppContextApis extends CyWebApiType {\n  readonly resource: ResourceApi       // per-app resource registration\n  readonly contextMenu: ContextMenuApi // per-app, auto-cleaned on disable\n}\n\u003c/code>\u003c/pre>\n\u003cblockquote>\n\u003cp>\u003cstrong>Note:\u003c/strong> \u003ccode>window.CyWebApi\u003c/code> is typed as \u003ccode>CyWebApiType\u003c/code> and does NOT include\n\u003ccode>resource\u003c/code>. Resource registration requires the per-app context available in\n\u003ccode>mount()\u003c/code> or via \u003ccode>useAppContext()\u003c/code>.\u003c/p>\n\u003c/blockquote>\n\u003ch3 id=\"cyappwithlifecycle\">\u003ccode>CyAppWithLifecycle\u003c/code>\u003c/h3>\n\u003cp>Extends the existing \u003ccode>CyApp\u003c/code> interface with lifecycle callbacks, declarative\nresource registration, and metadata:\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">interface CyAppWithLifecycle extends CyApp {\n  /** Declared API version this app targets (e.g. &#39;1.0&#39;). */\n  apiVersion?: string\n\n  /**\n   * Declarative resource registrations. The host registers these automatically\n   * when the app is loaded — no mount() needed.\n   */\n  resources?: ResourceDeclaration[]\n\n  mount?(context: AppContext): void | Promise&lt;void&gt;\n  unmount?(): void | Promise&lt;void&gt;\n}\n\u003c/code>\u003c/pre>\n\u003cp>The base \u003ccode>CyApp\u003c/code> interface provides the core metadata fields:\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">interface CyApp {\n  id: string             // unique ID, matches Module Federation name\n  name: string           // human-readable display name\n  description?: string   // short description shown in the App Settings panel\n  version?: string       // app&#39;s own semantic version (e.g. &#39;1.2.0&#39;)\n  /** @deprecated Prefer `resources` or runtime registration via mount(). */\n  components?: ComponentMetadata[]\n  status?: AppStatus     // managed by host; do not set manually\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>\u003ccode>resources\u003c/code>\u003c/strong> — declarative registration of panels and menu items. The host\nregisters them before \u003ccode>mount()\u003c/code> is called. For dynamic registration, use\n\u003ccode>apis.resource.registerPanel()\u003c/code> in \u003ccode>mount()\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>mount(context)\u003c/code>\u003c/strong> — called after declarative resources are registered. If it\nreturns a Promise, the host awaits it. Use for context menus, event listeners,\nand API-dependent initialization. If mount() throws, the host auto-cleans all\nregistered resources.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>unmount()\u003c/code>\u003c/strong> — called when the app is disabled or the page unloads. The host\ncalls \u003ccode>cleanupAllForApp()\u003c/code> before \u003ccode>unmount()\u003c/code>, so resources and context menu\nitems are already removed. Only manual cleanup (event listeners, timers) is needed.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>version\u003c/code>\u003c/strong> — import from \u003ccode>package.json\u003c/code> to keep in sync automatically.\u003c/li>\n\u003cli>\u003cstrong>\u003ccode>apiVersion\u003c/code>\u003c/strong> — reserved for future compatibility checks; set to \u003ccode>&#39;1.0&#39;\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>Existing apps without lifecycle methods continue to work unchanged.\u003c/p>\n\u003ch3 id=\"example\">Example\u003c/h3>\n\u003cpre>\u003ccode class=\"language-typescript\">import { lazy } from &#39;react&#39;\nimport type { CyAppWithLifecycle, AppContext } from &#39;@cytoscape-web/api-types&#39;\n\nlet _networkHandler: ((e: Event) =&gt; void) | null = null\n\nexport const MyApp: CyAppWithLifecycle = {\n  id: &#39;myApp&#39;,\n  name: &#39;My App&#39;,\n  description: &#39;Short description shown in App Settings.&#39;,\n  version: &#39;1.0.0&#39;,\n  apiVersion: &#39;1.0&#39;,\n\n  // Declarative: panels and menu items\n  resources: [\n    {\n      slot: &#39;right-panel&#39;,\n      id: &#39;MainPanel&#39;,\n      title: &#39;My App&#39;,\n      component: lazy(() =&gt; import(&#39;./components/MainPanel&#39;)),\n    },\n    {\n      slot: &#39;apps-menu&#39;,\n      id: &#39;MyMenuItem&#39;,\n      title: &#39;My Action&#39;,\n      component: lazy(() =&gt; import(&#39;./components/MyMenuItem&#39;)),\n      closeOnAction: true,\n    },\n  ],\n\n  // Imperative: context menus and event listeners\n  mount(context: AppContext) {\n    const { appId, apis } = context\n\n    // Context menu items (auto-cleaned on disable)\n    apis.contextMenu.addContextMenuItem({\n      label: &#39;My App: Inspect&#39;,\n      targetTypes: [&#39;node&#39;],\n      handler: (ctx) =&gt; console.log(`[${appId}]`, ctx.id),\n    })\n\n    // Event listeners (manual cleanup in unmount)\n    _networkHandler = (e: Event) =&gt; {\n      const { networkId } = (e as CustomEvent).detail\n      console.log(`[${appId}] switched to`, networkId)\n    }\n    window.addEventListener(&#39;network:switched&#39;, _networkHandler)\n  },\n\n  unmount() {\n    // Only event listeners need manual cleanup\n    if (_networkHandler) {\n      window.removeEventListener(&#39;network:switched&#39;, _networkHandler)\n      _networkHandler = null\n    }\n  },\n}\n\u003c/code>\u003c/pre>\n\u003chr>\n","text":"AppContext Passed to mount() when the app is activated: interface AppContext { readonly appId: string // unique ID of this app instance readonly apis: AppContextApis // per-app APIs (extends CyWebApiType) } AppContextApis Per-app API object that extends CyWebApiType with additional per-app capabilities: interface AppContextApis extends CyWebApiType { readonly resource: ResourceApi // per-app resource registration readonly contextMenu: ContextMenuApi // per-app, auto-cleaned on disable } Note: window.CyWebApi is typed as CyWebApiType and does NOT include resource . Resource registration requires the per-app context available in mount() or via useAppContext() . CyAppWithLifecycle Extends the existing CyApp interface with lifecycle callbacks, declarative resource registration, and metadata: interface CyAppWithLifecycle extends CyApp { /** Declared API version this app targets (e.g. '1.0'). */ apiVersion?: string /** * Declarative resource registrations. The host registers these automatically * when the app is loaded — no mount() needed. */ resources?: ResourceDeclaration[] mount?(context: AppContext): void | Promise\u003cvoid> unmount?(): void | Promise\u003cvoid> } The base CyApp interface provides the core metadata fields: interface CyApp { id: string // unique ID, matches Module Federation name name: string // human-readable display name description?: string // short description shown in the App Settings panel version?: string // app's own semantic version (e.g. '1.2.0') /** @deprecated Prefer `resources` or runtime registration via mount(). */ components?: ComponentMetadata[] status?: AppStatus // managed by host; do not set manually } resources — declarative registration of panels and menu items. The host registers them before mount() is called. For dynamic registration, use apis.resource.registerPanel() in mount() . mount(context) — called after declarative resources are registered. If it returns a Promise, the host awaits it. Use for context menus, event listeners, and API-dependent initialization. If mount() throws, the host auto-cleans all registered resources. unmount() — called when the app is disabled or the page unloads. The host calls cleanupAllForApp() before unmount() , so resources and context menu items are already removed. Only manual cleanup (event listeners, timers) is needed. version — import from package.json to keep in sync automatically. apiVersion — reserved for future compatibility checks; set to '1.0' . Existing apps without lifecycle methods continue to work unchanged. Example import { lazy } from 'react' import type { CyAppWithLifecycle, AppContext } from '@cytoscape-web/api-types' let _networkHandler: ((e: Event) => void) | null = null export const MyApp: CyAppWithLifecycle = { id: 'myApp', name: 'My App', description: 'Short description shown in App Settings.', version: '1.0.0', apiVersion: '1.0', // Declarative: panels and menu items resources: [ { slot: 'right-panel', id: 'MainPanel', title: 'My App', component: lazy(() => import('./components/MainPanel')), }, { slot: 'apps-menu', id: 'MyMenuItem', title: 'My Action', component: lazy(() => import('./components/MyMenuItem')), closeOnAction: true, }, ], // Imperative: context menus and event listeners mount(context: AppContext) { const { appId, apis } = context // Context menu items (auto-cleaned on disable) apis.contextMenu.addContextMenuItem({ label: 'My App: Inspect', targetTypes: ['node'], handler: (ctx) => console.log(`[${appId}]`, ctx.id), }) // Event listeners (manual cleanup in unmount) _networkHandler = (e: Event) => { const { networkId } = (e as CustomEvent).detail console.log(`[${appId}] switched to`, networkId) } window.addEventListener('network:switched', _networkHandler) }, unmount() { // Only event listeners need manual cleanup if (_networkHandler) { window.removeEventListener('network:switched', _networkHandler) _networkHandler = null } }, }"},{"title":"`window.CyWebApi`","anchor":"window-cywebapi","html":"\u003cp>The global \u003ccode>window.CyWebApi\u003c/code> object assembles all 10 domain APIs into a single\nsingleton. Available after the \u003ccode>cywebapi:ready\u003c/code> event.\u003c/p>\n\u003cpre>\u003ccode class=\"language-typescript\">interface CyWebApiType {\n  element:     ElementApi\n  network:     NetworkApi\n  selection:   SelectionApi\n  viewport:    ViewportApi\n  table:       TableApi\n  visualStyle: VisualStyleApi\n  layout:      LayoutApi\n  export:      ExportApi\n  workspace:   WorkspaceApi\n  contextMenu: ContextMenuApi\n}\n\u003c/code>\u003c/pre>\n\u003cpre>\u003ccode class=\"language-javascript\">window.addEventListener(&#39;cywebapi:ready&#39;, () =&gt; {\n  const api = window.CyWebApi\n  // api.element, api.network, api.selection, ...\n})\n\u003c/code>\u003c/pre>\n\u003cp>\u003ccode>AppContext.apis\u003c/code> extends \u003ccode>window.CyWebApi\u003c/code> with per-app \u003ccode>resource\u003c/code> and \u003ccode>contextMenu\u003c/code>\nfields. The 10 domain APIs (element, network, etc.) are shared; \u003ccode>resource\u003c/code> and the\nper-app \u003ccode>contextMenu\u003c/code> are exclusive to \u003ccode>AppContext.apis\u003c/code>.\u003c/p>\n","text":"The global window.CyWebApi object assembles all 10 domain APIs into a single singleton. Available after the cywebapi:ready event. interface CyWebApiType { element: ElementApi network: NetworkApi selection: SelectionApi viewport: ViewportApi table: TableApi visualStyle: VisualStyleApi layout: LayoutApi export: ExportApi workspace: WorkspaceApi contextMenu: ContextMenuApi } window.addEventListener('cywebapi:ready', () => { const api = window.CyWebApi // api.element, api.network, api.selection, ... }) AppContext.apis extends window.CyWebApi with per-app resource and contextMenu fields. The 10 domain APIs (element, network, etc.) are shared; resource and the per-app contextMenu are exclusive to AppContext.apis ."}],"surfaces":{"1.0.0-beta.4":{"version":"1.0.0-beta.4","commit":"e12bd423","namespaces":{"element":{"interfaceName":"ElementApi","methods":{"getNode":{"name":"getNode","params":[{"name":"networkId","type":"IdType","optional":false},{"name":"nodeId","type":"IdType","optional":false}],"returnType":"ApiResult\u003cNodeData>","signature":"getNode(networkId: IdType, nodeId: IdType): ApiResult\u003cNodeData>","jsdoc":"Read one node's attributes and position; fails if it does not exist."},"getEdge":{"name":"getEdge","params":[{"name":"networkId","type":"IdType","optional":false},{"name":"edgeId","type":"IdType","optional":false}],"returnType":"ApiResult\u003cEdgeData>","signature":"getEdge(networkId: IdType, edgeId: IdType): ApiResult\u003cEdgeData>","jsdoc":"Read one edge's endpoints and attributes; fails if it does not exist."},"getNodes":{"name":"getNodes","params":[{"name":"networkId","type":"IdType","optional":false},{"name":"nodeIds","type":"IdType[]","optional":true}],"returnType":"ApiResult\u003c{ nodes: Array\u003c{ id: IdType } & NodeData> missing: IdType[] }>","signature":"getNodes(networkId: IdType, nodeIds?: IdType[]): ApiResult\u003c{ nodes: Array\u003c{ id: IdType } & NodeData> missing: IdType[] }>","jsdoc":"Batch-read nodes with their attributes and positions. When `nodeIds`\nis omitted, every node in the network is returned. Ids that do not\nexist are reported in `missing` rather than failing the whole call."},"createNode":{"name":"createNode","params":[{"name":"networkId","type":"IdType","optional":false},{"name":"position","type":"[number, number, number?]","optional":false},{"name":"options","type":"CreateNodeOptions","optional":true}],"returnType":"ApiResult\u003c{ nodeId: IdType; node: NodeData }>","signature":"createNode(networkId: IdType, position: [number, number, number?], options?: CreateNodeOptions): ApiResult\u003c{ nodeId: IdType; node: NodeData }>","jsdoc":"Create a single node at `position`. `options.attributes` seed its row,\n`options.bypass` applies validated visual-property bypasses, and\n`options.autoSelect` (default true) selects it. Records one undo entry."},"createEdge":{"name":"createEdge","params":[{"name":"networkId","type":"IdType","optional":false},{"name":"sourceNodeId","type":"IdType","optional":false},{"name":"targetNodeId","type":"IdType","optional":false},{"name":"options","type":"CreateEdgeOptions","optional":true}],"returnType":"ApiResult\u003c{ edgeId: IdType; edge: EdgeData }>","signature":"createEdge(networkId: IdType, sourceNodeId: IdType, targetNodeId: IdType, options?: CreateEdgeOptions): ApiResult\u003c{ edgeId: IdType; edge: EdgeData }>","jsdoc":"Create a single edge between two existing nodes. Fails if either\nendpoint does not exist. Same options as createNode. Records one undo\nentry."},"createNodes":{"name":"createNodes","params":[{"name":"networkId","type":"IdType","optional":false},{"name":"nodes","type":"NodeSpec[]","optional":false},{"name":"options","type":"BatchCreateOptions","optional":true}],"returnType":"ApiResult\u003c{ nodes: Array\u003c{ nodeId: IdType; node: NodeData }> }>","signature":"createNodes(networkId: IdType, nodes: NodeSpec[], options?: BatchCreateOptions): ApiResult\u003c{ nodes: Array\u003c{ nodeId: IdType; node: NodeData }> }>","jsdoc":"Create many nodes in one operation that records a single undo entry\n(undoing removes them all at once). Each spec carries its own\nposition, attributes, and bypasses. Validation is all-or-nothing:\nif any spec is invalid, no node is created."},"createEdges":{"name":"createEdges","params":[{"name":"networkId","type":" e":"deleteEdges","params":[{"name":"networkId","type":"IdType","optional":false},{"name":"edgeIds","type":"IdType[]","optional":false}],"returnType":"ApiResult\u003c{ deletedEdgeCount: number deletedEdges: Array\u003c{ id: IdType } & EdgeData> /** Requested edge ids that did not exist. */ missing: IdType[] }>","signature":"deleteEdges(networkId: IdType, edgeIds: IdType[]): ApiResult\u003c{ deletedEdgeCount: number deletedEdges: Array\u003c{ id: IdType } & EdgeData> /** Requested edge ids that did not exist. */ missing: IdType[] }>","jsdoc":"Delete edges. Ids that don't exist are reported in `missing` rather\nthan failing the call; the operation fails only when none exist."},"generateNextNodeId":{"name":"generateNextNodeId","params":[{"name":"networkId","type":"IdType","optional":false}],"returnType":"ApiResult\u003c{ nodeId: IdType }>","signature":"generateNextNodeId(networkId: IdType): ApiResult\u003c{ nodeId: IdType }>","jsdoc":"Return the id the next created node in this network will receive."},"generateNextEdgeId":{"name":"generateNextEdgeId","params":[{"name":"networkId","type":"IdType","optional":false}],"returnType":"ApiResult\u003c{ edgeId: IdType }>","signature":"generateNextEdgeId(networkId: IdType): ApiResult\u003c{ edgeId: IdType }>","jsdoc":"Return the id the next created edge in this network will receive."},"getNodeIds":{"name":"getNodeIds","params":[{"name":"networkId","type":"IdType","optional":false}],"returnType":"ApiResult\u003c{ nodeIds: IdType[] }>","signature":"getNodeIds(networkId: IdType): ApiResult\u003c{ nodeIds: IdType[] }>","jsdoc":"Return all node IDs in the network."},"getEdgeIds":{"name":"getEdgeIds","params":[{"name":"networkId","type":"IdType","optional":false}],"returnType":"ApiResult\u003c{ edgeIds: IdType[] }>","signature":"getEdgeIds(networkId: IdType): ApiResult\u003c{ edgeIds: IdType[] }>","jsdoc":"Return all edge IDs in the network."},"getEdges":{"name":"getEdges","params":[{"name":"networkId","type":"IdType","optional":false}
